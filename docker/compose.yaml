# Build the jars first: mvn package (from back/). Secrets come from .env (see .env.example).
name: carmonai

x-readiness: &readiness
  # No curl in the JRE image: bash's /dev/tcp asks the actuator on the management port.
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

x-database: &database
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  DATABASE_DB: ${DB_NAME}
  DATABASE_USERNAME: ${DB_USER}
  DATABASE_PASSWORD: ${DB_PASSWORD}

x-valkey: &valkey
  VALKEY_HOST: valkey
  VALKEY_PORT: 6379
  VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in .env}

services:
  db:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: ${DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${DB_NAME:?set in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # API-key lookups, credit flags and rate buckets (each rebuilt on its own when lost), and the usage
  # events inference-service writes before relaying them to usage-service: those must survive a restart,
  # so an append-only file, fsynced every second, in a volume (a crash of Valkey itself loses ~1 s).
  valkey:
    image: valkey/valkey:9.0.6@sha256:63346cb24a61221e76bdf41acce99b3968a9fa83d8122144deab45394b27b4f2
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --save '' --appendonly yes --appendfsync everysec"]
    volumes: [valkey-data:/data]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Local mail catcher: account-service's verification and reset emails land here; its API (8025) stays
  # on the internal network (smoke.sh reads the links from it).
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  account:
    build: ../api/account-service
    environment:
      <<: *database
      MAIL_HOST: mailpit
      CONSOLE_URL: http://localhost:3000   # where the emailed links point (the console isn't built yet)
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  organization:
    build: ../api/organization-service
    environment: *database
    depends_on:
      db: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  auth:
    build: ../api/auth-service
    environment:
      <<: [*database, *valkey]
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set in .env}
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
      account: { condition: service_healthy }
      organization: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  # CPU dev engine: llama.cpp serving Qwen3-0.6B (OpenAI-compatible). Internal only; the first start
  # downloads the model (~640 MB) into the models volume. Thinking is off at the template, and the
  # API key comes from env (LLAMA_API_KEY), not the command line.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:970168341efef973da5666ea5c362fa428ee66ba0dfa621b0f69bf3feb3320f7
    command: ["-hf", "Qwen/Qwen3-0.6B-GGUF:Q8_0", "--host", "0.0.0.0", "--port", "8080", "--jinja",
              "--chat-template-kwargs", "{\"enable_thinking\":false}", "-c", "8192", "-np", "2",
              "--metrics", "--no-slots", "--no-webui", "--alias", "carmonai/qwen3-0.6b"]
    environment:
      LLAMA_CACHE: /models
      LLAMA_API_KEY: ${ENGINE_API_KEY:?set in .env}   # llama.cpp reads this one for --api-key (not LLAMA_ARG_API_KEY)
    volumes: [models:/models]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 600s
    networks: [internal]

  # The prototype bills in 10 s windows so a debit is visible within seconds (service defaults: 5 min, 60 s).
  usage:
    build: ../api/usage-service
    environment:
      <<: *database
      CARMONAI_USAGE_WINDOW: 10s
      CARMONAI_USAGE_GRACE: 2s
      CARMONAI_USAGE_SEAL_EVERY: 2s
    depends_on:
      db: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  billing:
    build: ../api/billing-service
    environment:
      <<: [*database, *valkey]
      CARMONAI_BILLING_DEBIT_EVERY: 2s
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
      usage: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  inference:
    build: ../api/inference-service
    environment:
      <<: *valkey
      ENGINE_URL: http://llama:8080
      ENGINE_API_KEY: ${ENGINE_API_KEY:?set in .env}
      CARMONAI_INFERENCE_USAGECLAIMAFTER: 10s   # a killed instance's unconfirmed usage events go out within seconds (default 60 s)
    depends_on:
      valkey: { condition: service_healthy }
      llama: { condition: service_healthy }
      usage: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  # Files and Batch API: runs batch lines through inference-service at the lowest priority.
  batch:
    build: ../api/batch-service
    environment:
      <<: *database
      CARMONAI_BATCH_ERASE_EVERY: 5s   # prototype: a closed organization's batch data goes within seconds
    depends_on:
      db: { condition: service_healthy }
      organization: { condition: service_healthy }
      inference: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  gateway:
    build: ../api/gateway-service
    ports: ["8080:8080"]
    volumes: ["access-logs:/var/log/carmonai"]   # Marco Civil access log, 6 months (logback-spring.xml)
    environment:
      <<: *valkey
      CONSOLE_ORIGINS: http://localhost:3000     # the only Origin allowed on login/register/refresh/logout
      CARMONAI_GATEWAY_REGISTRATIONOPEN: "true"  # the harness registers through the gateway; production must not set this
    depends_on:
      valkey: { condition: service_healthy }
      auth: { condition: service_healthy }
      account: { condition: service_healthy }
      organization: { condition: service_healthy }
      inference: { condition: service_healthy }
      batch: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

networks:
  internal: {}

volumes:
  db-data: {}
  valkey-data: {}
  access-logs: {}
  models: {}
