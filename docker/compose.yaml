# Build the jars first: mvn package (from back/). Secrets come from .env (see .env.example).
#
# The model engine is a SIMULATOR (llm-d-inference-sim) that speaks vLLM's contract (ADR 0002: no CPU engine, dev and CI
# run a simulated one). compose.gpu.yaml swaps in the real vLLM on the laptop GPU. The `fleet` profile adds a fleet
# (many simulators behind a stand-in, several gateway and inference replicas):
#   docker compose --env-file .env --env-file fleet.env --profile fleet up -d --build --wait
name: carmona

x-readiness: &readiness
  # No curl in the JRE image: bash's /dev/tcp asks the actuator on the management port.
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

x-database: &database
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  DATABASE_DB: ${DB_NAME}
  DATABASE_USERNAME: ${DB_USER}
  DATABASE_PASSWORD: ${DB_PASSWORD}

x-valkey: &valkey
  VALKEY_HOST: valkey
  VALKEY_PORT: 6379
  VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in .env}

# The simulated engine: llm-d-inference-sim v0.11.4 plus docker/sim/disconnect.patch (a client that hangs up stops the
# generation, usage on every chunk). A LOCAL image: build it once with `bash docker/sim/build.sh` (see there), compose never
# pulls it. ENGINE_IMAGE swaps in another, for example upstream's own, pinned by digest (the tag alone is not a pin, G11 of
# work/prototype-sim/FINDINGS-contract.md): ghcr.io/llm-d/llm-d-inference-sim:v0.11.4@sha256:d60f0fb00ac62d0eb7c100e7a6816b8acec487aa06f0f38dba72b0ab1754e8f6
# (then run smoke.sh with SIM_STOCK=1: that engine cannot pass the two assertions below).
x-engine-image: &engine-image ${ENGINE_IMAGE:-carmona/llm-d-inference-sim:v0.11.4-disconnect.1}

services:
  db:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: ${DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${DB_NAME:?set in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # API-key lookups, credit flags and rate buckets (each rebuilt on its own when lost), and the usage
  # events inference-service writes before relaying them to usage-service: those must survive a restart,
  # so an append-only file, fsynced every second, in a volume (a crash of Valkey itself loses ~1 s).
  # Before this step valkey ran as root, so a valkey-data volume from an earlier checkout is root-owned (0700) and uid 999
  # cannot write its append-only file: valkey would exit 1 and take inference, gateway and usage with it. One chown fixes
  # it, and the events waiting in the file survive. Same shape as minio-volume: root for that chown only, read-only
  # filesystem, no network, and only the capabilities it needs: CHOWN, and DAC_READ_SEARCH because on every run after the
  # first the directory is already valkey's (mode 0700) and root without it cannot even list it (exit 1, which then
  # blocks `up valkey`, as smoke.sh does when it restarts valkey).
  valkey-volume:
    image: valkey/valkey:9.0.6@sha256:63346cb24a61221e76bdf41acce99b3968a9fa83d8122144deab45394b27b4f2
    user: "0:0"
    entrypoint: ["chown", "-R", "999:999", "/data"]
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    volumes: [valkey-data:/data]

  valkey:
    image: valkey/valkey:9.0.6@sha256:63346cb24a61221e76bdf41acce99b3968a9fa83d8122144deab45394b27b4f2
    depends_on:
      valkey-volume: { condition: service_completed_successfully }
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --save '' --appendonly yes --appendfsync everysec"]
    # `sh -c` as the command skips the image entrypoint's step down to the valkey user, so the user is set here.
    user: "999:999"
    volumes: [valkey-data:/data]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Local mail catcher: account-service's verification and reset emails land here; its API (8025) stays
  # on the internal network (smoke.sh reads the links from it).
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    user: "65532:65532"                 # the image runs as root; nothing here needs it (ports above 1024, mail kept in memory)
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  account:
    secrets: [internal_token]   # BE-24: the internal-endpoint secret; the gateway has no such line on purpose
    build: ../api/account-service
    environment:
      <<: *database
      MAIL_HOST: mailpit
      CONSOLE_URL: http://localhost:3000   # where the emailed links point (the console isn't built yet)
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  organization:
    secrets: [internal_token]   # BE-24: the internal-endpoint secret; the gateway has no such line on purpose
    build: ../api/organization-service
    environment: *database
    depends_on:
      db: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  auth:
    secrets: [internal_token]   # BE-24: the internal-endpoint secret; the gateway has no such line on purpose
    build: ../api/auth-service
    environment:
      <<: [*database, *valkey]
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set in .env}
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
      account: { condition: service_healthy }
      organization: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  # The default engine: llm-d-inference-sim, shaped like the measured vLLM GPU profile (compose.gpu.yaml): model
  # carmona/qwen3-4b, 4 running + 8 waiting, a 4096 window, latency calibrated to the laptop measurements (TTFT p95
  # 0.8 s, 24 ms per token). The defaults of the simulator (5 slots, 1024 window, queue 1000) are traps: every flag is set.
  # Echo mode makes the output as long as the prompt, so long streams (smoke's hang-up and tier-share steps, the
  # fairness drill) do not depend on a random output length; the usage the engine counts is still its own.
  # Known limits (FINDINGS-contract.md): it ignores `priority` and `cache_salt`. The disconnect patch closes G1 (it used to
  # generate to the end for a client that had hung up) and G3 (usage only in the last chunk), so smoke runs the two
  # assertions that need them. Distroless: no shell, so no in-container healthcheck (G4); inference-service starts
  # when it has started and the scrape and every call have timeouts. Scalable (no container_name): ENGINE_REPLICAS.
  engine:
    image: *engine-image
    pull_policy: never                  # a local build (docker/sim/build.sh): a missing image is an error, not a pull from a registry
    command:
      - --model=carmona/qwen3-4b
      - --port=8000
      - --mode=echo
      - --max-num-seqs=4
      - --max-waiting-queue-length=8
      - --max-model-len=4096
      - --latency-calculator=constant
      - --time-to-first-token=600ms
      - --time-to-first-token-std-dev=100ms
      - --inter-token-latency=24ms
      - --inter-token-latency-std-dev=4ms
      - --seed=42
    deploy:
      replicas: ${ENGINE_REPLICAS:-1}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    stop_grace_period: 35s              # it drains in-flight streams on SIGTERM
    networks: [internal]

  # fleet profile: STAND-IN for the replica picker, between inference-service and the simulators only (the gateway
  # reaches the inference replicas directly, so its own balancing is what runs). Set ENGINE_URL=http://engine-lb:8000
  # and ENGINE_SLOTS / ENGINE_QUEUE to the fleet's sums (fleet.env does). Not a product component.
  engine-lb:
    profiles: ["fleet"]
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    user: "101:101"                     # nginx; its pid and temp files are in /tmp (nginx.conf)
    volumes: ["./engine-lb/nginx.conf:/etc/nginx/nginx.conf:ro"]
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      engine: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    networks: [internal]

  # Script host on the compose network (curl, bash, python3): smoke.sh, the benches and the scorecard drivers run from
  # here, because the JRE images have no curl and internal endpoints have no gateway route. Built from tools/.
  tools:
    secrets: [internal_token]   # BE-24: the internal-endpoint secret; the gateway has no such line on purpose
    build: ./tools
    command: ["sleep", "infinity"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 2s
      retries: 3
    mem_limit: 256m
    stop_grace_period: 1s
    networks: [internal]

  # The prototype bills in 10 s windows so a debit is visible within seconds (service defaults: 5 min, 60 s).
  usage:
    build: ../api/usage-service
    environment:
      <<: *database
      CARMONA_USAGE_WINDOW: 10s
      CARMONA_USAGE_GRACE: 2s
      CARMONA_USAGE_SEAL_EVERY: 2s
    depends_on:
      db: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  billing:
    secrets: [internal_token]   # BE-24: the internal-endpoint secret; the gateway has no such line on purpose
    build: ../api/billing-service
    environment:
      <<: [*database, *valkey]
      CARMONA_BILLING_DEBIT_EVERY: 2s
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
      usage: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  inference:
    build: ../api/inference-service
    # One model, set through the environment (Spring replaces the model of application.yaml). Single simulator: url
    # http://engine:8000 and the simulator's 4 slots + 2 queued; a fleet sets ENGINE_URL, ENGINE_SLOTS and ENGINE_QUEUE
    # (the sums over the simulators) and INFERENCE_REPLICAS (each replica divides the slots by it while Valkey is down).
    environment:
      <<: *valkey
      # Spring replaces a whole list from the first source that defines any element of it, so the environment states
      # every field of the model (application.yaml's list is not merged with it).
      CARMONA_INFERENCE_MODELS_0_ID: carmona/qwen3-4b
      CARMONA_INFERENCE_MODELS_0_CREATED: "2026-10-01T00:00:00Z"   # BE-12: required, shown as Unix seconds by GET /v1/models/{id}
      CARMONA_INFERENCE_MODELS_0_URL: ${ENGINE_URL:-http://engine:8000}
      CARMONA_INFERENCE_MODELS_0_APIKEY: ${ENGINE_API_KEY:?set in .env}
      CARMONA_INFERENCE_MODELS_0_CONTEXTWINDOW: 4096
      CARMONA_INFERENCE_MODELS_0_MAXOUTPUT: 1024
      CARMONA_INFERENCE_MODELS_0_SLOTS: ${ENGINE_SLOTS:-4}
      CARMONA_INFERENCE_MODELS_0_QUEUE: ${ENGINE_QUEUE:-2}
      CARMONA_INFERENCE_EXPECTEDREPLICAS: ${INFERENCE_REPLICAS:-1}
      CARMONA_INFERENCE_RECONCILEEVERY: ${RECONCILE_EVERY:-1h}
      CARMONA_INFERENCE_USAGECLAIMAFTER: 10s   # a killed instance's unconfirmed usage events go out within seconds (default 60 s)
      # The engine contract check (WP-03) holds an engine to the metric families vLLM exposes (eight of them, the code default).
      # The simulator exposes four of them from the start and never the prefix-cache ones, so on this stack the check would raise
      # carmona_engine_contract_ok{check="metrics"} = 0 for ever, and EngineContractMismatch with it. These four are what the
      # simulator can satisfy; compose.gpu.yaml puts the default list back for the real engine. The list is read from the environment
      # as one comma-separated value.
      CARMONA_INFERENCE_CONTRACT_REQUIREDFAMILIES: vllm:num_requests_running,vllm:num_requests_waiting,vllm:kv_cache_usage_perc,vllm:cache_config_info
    deploy:
      replicas: ${INFERENCE_REPLICAS:-1}
    depends_on:
      valkey: { condition: service_healthy }
      engine: { condition: service_started }
      # fleet profile only: inference-service reads the engine at startup (vllm:cache_config_info), so on the fleet it must
      # start after the stand-in answers. Without the profile this service does not exist and `required: false` skips it.
      engine-lb: { condition: service_healthy, required: false }
      usage: { condition: service_healthy }
    # A restart finishes the streams it holds: spring.lifecycle.timeout-per-shutdown-phase is 660 s (application.yaml), and the
    # runtime must wait longer than that or it kills the JVM mid-stream. Compose's default is 10 s.
    stop_grace_period: 720s
    healthcheck: *readiness
    networks: [internal]

  # Files and Batch API: runs batch lines through inference-service at the lowest priority.
  batch:
    build: ../api/batch-service
    environment:
      <<: *database
      CARMONA_BATCH_ERASE_EVERY: 5s   # prototype: a closed organization's batch data goes within seconds
    depends_on:
      db: { condition: service_healthy }
      organization: { condition: service_healthy }
      inference: { condition: service_healthy }
    healthcheck: *readiness
    networks: [internal]

  gateway:
    build: ../api/gateway-service
    # The only published port, on loopback. Exactly 8080 by default: with a range, Docker picks any free port in it (not
    # the lowest), and a script then talks to whatever else listens on 8080. fleet.env sets a range for several replicas;
    # see the ports with `docker compose ps`. The scorecard drivers run in the tools container, at http://gateway:8080.
    ports: ["${GATEWAY_PORTS:-127.0.0.1:8080:8080}"]
    deploy:
      replicas: ${GATEWAY_REPLICAS:-1}
    volumes: ["access-logs:/var/log/carmona"]   # Marco Civil access log, 6 months (logback-spring.xml)
    environment:
      <<: *valkey
      CONSOLE_ORIGINS: http://localhost:3000     # the only Origin allowed on login/register/refresh/logout
      CARMONA_GATEWAY_REGISTRATIONOPEN: "true"  # the harness registers through the gateway; production must not set this
    depends_on:
      valkey: { condition: service_healthy }
      auth: { condition: service_healthy }
      account: { condition: service_healthy }
      organization: { condition: service_healthy }
      inference: { condition: service_healthy }
      batch: { condition: service_healthy }
    # Rolling restart (ShutdownDrain): carmona.gateway.drain-delay (10 s) + timeout-per-shutdown-phase (660 s) must fit inside this,
    # or the runtime kills the JVM mid-stream. Compose's default is 10 s.
    stop_grace_period: 720s
    healthcheck: *readiness
    networks: [internal]

  # Metrics and dashboards. Operator tools on the internal network, exactly like the management ports they
  # scrape: nothing here is published. Prometheus scrapes every service's :8081/actuator/prometheus, plus
  # the engine's own /metrics (the only place queue depth and KV-cache use are visible between reconciles).
  # Grafana's datasource, dashboards and alert list come from docker/grafana, so nothing survives only in a
  # container. Limits are tight on purpose: this VM also runs twelve services.
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    # An engine may want its key on /metrics (the simulator ignores it). Prometheus expands no environment
    # variables in a scrape config, so the entrypoint writes the key -- from the environment, never a repo file,
    # never a default -- to the file the config's bearer_token_file points at, then execs prometheus.
    # ponytail: 15 days of local TSDB and no remote write -- long-term storage is infrastructure nobody has
    # asked for yet, and a restart keeps the history that matters (named volume). Upgrade: remote write plus
    # a store, when someone needs a quarter of history.
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$ENGINE_API_KEY" > /tmp/engine-key
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d
    environment:
      ENGINE_API_KEY: ${ENGINE_API_KEY:?set in .env}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "/bin/promtool", "query", "instant", "http://127.0.0.1:9090", "vector(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 512m
    cpus: 0.5
    networks: [internal]

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    # The image already runs as its own grafana user (472, root group) and /var/lib/grafana is writable by
    # it, so there is no reason to run this as root and no volume needed: the dashboards are files.
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"    # no usage statistics leave this machine
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 384m
    cpus: 0.5
    networks: [internal]

# BE-24 (SEC-04): one shared secret, one line "X-Internal-Token: <64 hex>", created by `bash init-secrets.sh` before the first `up`.
# billing, organization, account and auth refuse to start without it; the gateway and every other service never see it.
secrets:
  internal_token:
    file: ./secrets/internal_token

networks:
  internal: {}

volumes:
  db-data: {}
  valkey-data: {}
  access-logs: {}
  prometheus-data: {}
