# Dashboards come from docker/grafana/dashboards. The UI cannot edit or delete them: a change made in the
# browser would not survive the next container restart, so it is not allowed to look like it did.
apiVersion: 1
providers:
  - name: carmona
    orgId: 1
    folder: Carmona
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
