# Unit tests for rules.yml, run with the pinned Prometheus image's promtool (no stack needed): bash docker/check-prometheus.sh
# Each case fails if the alert expression regresses to the earlier one.
rule_files: [rules.yml]
evaluation_interval: 15s

tests:
  # The engine has no target at all (every replica removed, or its name stopped resolving): DNS service discovery yields none
  # and Prometheus writes no `up{job="engine"}` at all. `up == 0` alone is an empty vector here; the absent() branch fires.
  - name: EngineUnreachable fires when the engine has no target at all
    interval: 15s
    input_series:
      - {series: 'up{job="prometheus"}', values: '1x10'}
    alert_rule_test:
      - {eval_time: 30s, alertname: EngineUnreachable, exp_alerts: []}
      - eval_time: 2m
        alertname: EngineUnreachable
        exp_alerts:
          - exp_labels: {severity: critical, job: engine}
            exp_annotations:
              summary: "no model engine is reachable (engine target down)"
              description: >-
                Every engine scrape is failing: inference-service will answer 503 once its one retry is spent.
                Check the engine container (the real one downloads the model on first start, which is slow but
                the container reports starting, not failing) and confirm the key in .env still matches the one
                the engine was started with.

  # A target that exists and fails its scrape is the other shape of the same outage.
  - name: EngineUnreachable fires when every engine target fails its scrape
    interval: 15s
    input_series:
      - {series: 'up{job="engine", instance="a"}', values: '0x10'}
      - {series: 'up{job="engine", instance="b"}', values: '0x10'}
    alert_rule_test:
      - eval_time: 2m
        alertname: EngineUnreachable
        exp_alerts:
          - exp_labels: {severity: critical, job: engine}
            exp_annotations:
              summary: "no model engine is reachable (engine target down)"
              description: >-
                Every engine scrape is failing: inference-service will answer 503 once its one retry is spent.
                Check the engine container (the real one downloads the model on first start, which is slow but
                the container reports starting, not failing) and confirm the key in .env still matches the one
                the engine was started with.

  # One simulator of a fleet down is not the outage; and vllm having no series (it has none on the simulator stack)
  # must not make the absent() branch fire while `engine` is up.
  - name: EngineUnreachable stays quiet while any replica answers
    interval: 15s
    input_series:
      - {series: 'up{job="engine", instance="a"}', values: '1x10'}
      - {series: 'up{job="engine", instance="b"}', values: '0x10'}
    alert_rule_test:
      - {eval_time: 2m, alertname: EngineUnreachable, exp_alerts: []}

  # The alert fires when the engine's waiting requests reach the queue places inference-service admits
  # (carmona_engine_queue_places, the model's total over its engine replicas), not a constant. A real vLLM counts running +
  # waiting against its cap, so with 4 slots and 2 places it never shows more than 2 waiting and the old `>= 8` could not
  # fire. Two inference-service replicas report the same gauge: it is the fleet's number, not twice of it.
  - name: EngineQueueSustained fires when the waiting requests reach the queue places, not the old constant 8
    interval: 15s
    input_series:
      - {series: 'carmona_engine_queue_places{model="m1", job="inference", instance="10.0.0.2:8081"}', values: '2x40'}
      - {series: 'carmona_engine_queue_places{model="m1", job="inference", instance="10.0.0.3:8081"}', values: '2x40'}
      - {series: 'vllm:num_requests_waiting{job="vllm", instance="a"}', values: '2x12 0x30'}
    alert_rule_test:
      - {eval_time: 1m45s, alertname: EngineQueueSustained, exp_alerts: []}
      - eval_time: 2m
        alertname: EngineQueueSustained
        exp_alerts:
          - exp_labels: {severity: warning, job: vllm}
            exp_annotations:
              summary: "vllm has 2 requests waiting, every queue place inference-service admits, for 2m"
              description: >-
                The engine holds as many waiting requests as inference-service lets queue behind the slots (the
                queue places, summed over the engine replicas): admission is running the engine at its full
                stretch, and the next request waits in TTFT or is refused. Check TTFT p95 and the refusals on the
                SLO dashboard; if the engine is healthy, C (slots) is the number to revisit. The engine's own cap
                (vLLM --max-num-queued-reqs counts running + waiting) must be slots + queue places, or it refuses
                before this fires.
      - {eval_time: 4m, alertname: EngineQueueSustained, exp_alerts: []}

  # The simulator fleet: 2 queue places per simulator and 2 simulators here, so 4 in total, and both queues are full.
  - name: EngineQueueSustained compares the fleet's waiting requests with the fleet's queue places
    interval: 15s
    input_series:
      - {series: 'carmona_engine_queue_places{model="m1", job="inference", instance="10.0.0.2:8081"}', values: '4x40'}
      - {series: 'vllm:num_requests_waiting{job="engine", instance="a"}', values: '2x40'}
      - {series: 'vllm:num_requests_waiting{job="engine", instance="b"}', values: '2x40'}
    alert_rule_test:
      - eval_time: 3m
        alertname: EngineQueueSustained
        exp_alerts:
          - exp_labels: {severity: warning, job: engine}
            exp_annotations:
              summary: "engine has 4 requests waiting, every queue place inference-service admits, for 2m"
              description: >-
                The engine holds as many waiting requests as inference-service lets queue behind the slots (the
                queue places, summed over the engine replicas): admission is running the engine at its full
                stretch, and the next request waits in TTFT or is refused. Check TTFT p95 and the refusals on the
                SLO dashboard; if the engine is healthy, C (slots) is the number to revisit. The engine's own cap
                (vLLM --max-num-queued-reqs counts running + waiting) must be slots + queue places, or it refuses
                before this fires.

  # One replica with a full queue while the other is empty is not the fleet at its limit: admission sends the next request to
  # the replica with room.
  - name: EngineQueueSustained stays quiet while one replica has room
    interval: 15s
    input_series:
      - {series: 'carmona_engine_queue_places{model="m1", job="inference", instance="10.0.0.2:8081"}', values: '4x40'}
      - {series: 'vllm:num_requests_waiting{job="engine", instance="a"}', values: '2x40'}
      - {series: 'vllm:num_requests_waiting{job="engine", instance="b"}', values: '0x40'}
    alert_rule_test:
      - {eval_time: 5m, alertname: EngineQueueSustained, exp_alerts: []}

  - name: EngineQueueSustained stays quiet one request below the queue places
    interval: 15s
    input_series:
      - {series: 'carmona_engine_queue_places{model="m1", job="inference", instance="10.0.0.2:8081"}', values: '2x40'}
      - {series: 'vllm:num_requests_waiting{job="vllm", instance="a"}', values: '1x40'}
    alert_rule_test:
      - {eval_time: 5m, alertname: EngineQueueSustained, exp_alerts: []}

  # A model may have no queue places (queue: 0 is valid, slots + 0 in flight). An idle engine then reads 0 waiting against 0
  # places, and `0 >= 0` alone would hold the alert open forever: only requests that actually wait count.
  - name: EngineQueueSustained stays quiet on an idle engine when the model has no queue places
    interval: 15s
    input_series:
      - {series: 'carmona_engine_queue_places{model="m1", job="inference", instance="10.0.0.2:8081"}', values: '0x40'}
      - {series: 'vllm:num_requests_waiting{job="vllm", instance="a"}', values: '0x40'}
    alert_rule_test:
      - {eval_time: 5m, alertname: EngineQueueSustained, exp_alerts: []}

  # ... but a request waiting where the model admits none is past the places and does fire.
  - name: EngineQueueSustained fires when a request waits and the model has no queue places
    interval: 15s
    input_series:
      - {series: 'carmona_engine_queue_places{model="m1", job="inference", instance="10.0.0.2:8081"}', values: '0x40'}
      - {series: 'vllm:num_requests_waiting{job="vllm", instance="a"}', values: '1x40'}
    alert_rule_test:
      - eval_time: 3m
        alertname: EngineQueueSustained
        exp_alerts:
          - exp_labels: {severity: warning, job: vllm}
            exp_annotations:
              summary: "vllm has 1 requests waiting, every queue place inference-service admits, for 2m"
              description: >-
                The engine holds as many waiting requests as inference-service lets queue behind the slots (the
                queue places, summed over the engine replicas): admission is running the engine at its full
                stretch, and the next request waits in TTFT or is refused. Check TTFT p95 and the refusals on the
                SLO dashboard; if the engine is healthy, C (slots) is the number to revisit. The engine's own cap
                (vLLM --max-num-queued-reqs counts running + waiting) must be slots + queue places, or it refuses
                before this fires.

  # Full for 1m45s and then drained: pending, never firing.
  - name: EngineQueueSustained does not fire when the queue drains before 2m
    interval: 15s
    input_series:
      - {series: 'carmona_engine_queue_places{model="m1", job="inference", instance="10.0.0.2:8081"}', values: '2x40'}
      - {series: 'vllm:num_requests_waiting{job="vllm", instance="a"}', values: '2x7 0x30'}
    alert_rule_test:
      - {eval_time: 2m, alertname: EngineQueueSustained, exp_alerts: []}
      - {eval_time: 5m, alertname: EngineQueueSustained, exp_alerts: []}

  # Without the places gauge (inference-service down or an old build) the threshold is unknown, so the alert stays quiet
  # instead of guessing; ServiceDown is what names a dead inference-service.
  - name: EngineQueueSustained stays quiet while the queue places are not reported
    interval: 15s
    input_series:
      - {series: 'vllm:num_requests_waiting{job="vllm", instance="a"}', values: '9x40'}
    alert_rule_test:
      - {eval_time: 5m, alertname: EngineQueueSustained, exp_alerts: []}

  # One replica of a replicated service down is visible on its own series (dns_sd gives one `up` per replica); the one that
  # still answers is not named. A static single name had one series, so this could not be told apart.
  - name: ServiceDown names the one replica that is down
    interval: 15s
    input_series:
      - {series: 'up{job="inference", instance="10.0.0.2:8081"}', values: '1x20'}
      - {series: 'up{job="inference", instance="10.0.0.3:8081"}', values: '0x20'}
      - {series: 'up{job="gateway", instance="10.0.0.4:8081"}', values: '1x20'}
      - {series: 'up{job="gateway", instance="10.0.0.5:8081"}', values: '1x20'}
    alert_rule_test:
      - {eval_time: 1m, alertname: ServiceDown, exp_alerts: []}
      - eval_time: 3m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels: {severity: critical, job: inference, instance: "10.0.0.3:8081"}
            exp_annotations:
              summary: "inference 10.0.0.3:8081 has not answered a scrape for 2m"
              description: >-
                Prometheus cannot reach 10.0.0.3:8081/actuator/prometheus (inference; one series per
                replica for inference and gateway, so this names the replica). The container may be down,
                still starting, or its management port not listening. Check the container's own health status
                and its logs. No metrics for this service means no SLI either.

  # Every replica removed: the name stops resolving and there is no `up` series, so ServiceDown is silent; the absence alert is not.
  - name: ReplicatedServiceAbsent fires when a replicated service has no target at all
    interval: 15s
    input_series:
      - {series: 'up{job="inference", instance="10.0.0.2:8081"}', values: '1x20'}
    alert_rule_test:
      - {eval_time: 1m, alertname: ReplicatedServiceAbsent, exp_alerts: []}
      - eval_time: 3m
        alertname: ReplicatedServiceAbsent
        exp_alerts:
          - exp_labels: {severity: critical, job: gateway}
            exp_annotations:
              summary: "gateway has no scrape target at all for 2m"
              description: >-
                No replica of gateway resolves any more (removed, or never started), so Prometheus has no target
                and no `up` series to alert on. Check `docker compose ps gateway`.

  # One replica of two leaves discovery (its name stopped resolving): no series for it, no `up == 0`, ServiceDown is silent.
  # Fires once the count stays below the 30 m maximum; stays quiet while both answer.
  - name: ReplicaMissing fires when one of two replicas leaves discovery
    interval: 15s
    input_series:
      - {series: 'up{job="inference", instance="10.0.0.2:8081"}', values: '1x240'}
      - {series: 'up{job="inference", instance="10.0.0.3:8081"}', values: '1x40 _x200'}
    alert_rule_test:
      - {eval_time: 8m, alertname: ReplicaMissing, exp_alerts: []}
      - eval_time: 20m
        alertname: ReplicaMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: inference}
            exp_annotations:
              summary: "inference has fewer scrape targets than it had in the last 30m"
              description: >-
                A replica of inference no longer resolves or no longer exists, and the rest still answer, so no `up == 0`
                exists to alert on. Compare `docker compose ps inference` with the replicas you asked for.
      - {eval_time: 20m, alertname: ServiceDown, exp_alerts: []}

  # --- Alerts on metrics that already exist (OPEN-15) ----------------------------------------------------------------
  # Every case below pins the three edges of an alert's `for`: true for one scrape less than `for` never fires, true for
  # `for` exactly fires, and a series that goes back to normal resolves. So lengthening or shortening `for` fails here.

  # inference-service answers while Valkey does not (each replica admits against its own share of the slots). One series
  # per replica, so the alert names the replica; the replica that can reach Valkey stays out of it.
  - name: LeaseStoreDown fires after 1m, names the replica, and resolves when Valkey answers
    interval: 15s
    input_series:
      - {series: 'carmona_inference_lease_store_unavailable{job="inference", instance="10.0.0.2:8081"}', values: '1x12 0x12'}
      - {series: 'carmona_inference_lease_store_unavailable{job="inference", instance="10.0.0.3:8081"}', values: '0x24'}
    alert_rule_test:
      - {eval_time: 45s, alertname: LeaseStoreDown, exp_alerts: []}
      - eval_time: 1m
        alertname: LeaseStoreDown
        exp_alerts:
          - exp_labels: {severity: warning, job: inference, instance: "10.0.0.2:8081"}
            exp_annotations:
              summary: "inference 10.0.0.2:8081 cannot reach Valkey (the lease store) for 1m"
              description: >-
                Requests are still served: this replica admits against its own share of the slots and queue places
                (the model's, the tier's and the organization's, each divided by the expected-replicas setting, not by the
                number of replicas that run) and does not check the lease token budget, so the caps are only approximate
                until Valkey answers again. Check the valkey container and its health, then this replica's log for
                "lease store unavailable".
      - {eval_time: 4m, alertname: LeaseStoreDown, exp_alerts: []}

  - name: LeaseStoreDown does not fire when Valkey is back before a minute is up
    interval: 15s
    input_series:
      - {series: 'carmona_inference_lease_store_unavailable{job="inference", instance="10.0.0.2:8081"}', values: '1x3 0x20'}
    alert_rule_test:
      - {eval_time: 45s, alertname: LeaseStoreDown, exp_alerts: []}
      - {eval_time: 1m, alertname: LeaseStoreDown, exp_alerts: []}
      - {eval_time: 2m, alertname: LeaseStoreDown, exp_alerts: []}

  # usage-service seals a 5 m window grace (60 s) after it ends, on a 60 s timer, and refreshes the gauge every 10 s, so a
  # healthy seal reads 0 or up to 130 s; 180 is that plus a margin. The series is per usage replica and has no other label.
  - name: SealLagHigh fires after 5m above 180 s and resolves when the seal catches up
    interval: 15s
    input_series:
      - {series: 'carmona_usage_seal_lag_seconds{job="usage", instance="10.0.0.7:8081"}', values: '200x40 0x40'}
    alert_rule_test:
      - {eval_time: 4m45s, alertname: SealLagHigh, exp_alerts: []}
      - eval_time: 5m
        alertname: SealLagHigh
        exp_alerts:
          - exp_labels: {severity: warning, job: usage, instance: "10.0.0.7:8081"}
            exp_annotations:
              summary: "usage windows are sealed 3m 20s late (above 3m for 5m)"
              description: >-
                usage-service has not sealed the windows that are due: billing only bills sealed windows, so usage is
                piling up unbilled and the credit check runs on old balances. A healthy seal reads 0 to about 130 s
                (grace 60 s, seal-every 60 s, gauge-every 10 s). Check the usage container's log for seal errors, the
                database it seals in, and whether the seal job is held up behind another scheduled job.
      - {eval_time: 12m, alertname: SealLagHigh, exp_alerts: []}

  - name: SealLagHigh does not fire when the lag is back under the line before 5m
    interval: 15s
    input_series:
      - {series: 'carmona_usage_seal_lag_seconds{job="usage", instance="10.0.0.7:8081"}', values: '200x18 0x40'}
    alert_rule_test:
      - {eval_time: 5m, alertname: SealLagHigh, exp_alerts: []}
      - {eval_time: 10m, alertname: SealLagHigh, exp_alerts: []}

  # The line is strict: 180 is the last healthy-with-margin value, so a lag stuck at exactly 180 is not an alert.
  - name: SealLagHigh stays quiet at exactly 180 s
    interval: 15s
    input_series:
      - {series: 'carmona_usage_seal_lag_seconds{job="usage", instance="10.0.0.7:8081"}', values: '180x60'}
    alert_rule_test:
      - {eval_time: 10m, alertname: SealLagHigh, exp_alerts: []}

  # billing-service debits sealed windows on a 60 s timer: a healthy debit lag is 0 or up to grace + seal-every + debit-every
  # (180 s, 190 s with the gauge refresh), so 300 s is a debit that has missed about two runs after the seal.
  - name: DebitLagHigh fires after 5m above 300 s and resolves when the debit catches up
    interval: 15s
    input_series:
      - {series: 'carmona_billing_debit_lag_seconds{job="billing", instance="10.0.0.8:8081"}', values: '320x40 0x40'}
    alert_rule_test:
      - {eval_time: 4m45s, alertname: DebitLagHigh, exp_alerts: []}
      - eval_time: 5m
        alertname: DebitLagHigh
        exp_alerts:
          - exp_labels: {severity: critical, job: billing, instance: "10.0.0.8:8081"}
            exp_annotations:
              summary: "billing is 5m 20s behind on debiting sealed usage (above 5m for 5m)"
              description: >-
                billing-service has not debited windows that usage-service already sealed, so credit balances and the
                no_credit flags run late: a customer whose credit ran out keeps being served for longer than the 8
                minute overshoot bound the terms quote. A healthy debit reads 0 to about 190 s. Check the billing
                container's log for debit errors, whether usage-service answers it (the debit reads the sealed
                windows from there), and the database; a backlog drains 100 windows per run.
      - {eval_time: 12m, alertname: DebitLagHigh, exp_alerts: []}

  - name: DebitLagHigh does not fire when the lag is back under the line before 5m
    interval: 15s
    input_series:
      - {series: 'carmona_billing_debit_lag_seconds{job="billing", instance="10.0.0.8:8081"}', values: '320x18 0x40'}
    alert_rule_test:
      - {eval_time: 5m, alertname: DebitLagHigh, exp_alerts: []}
      - {eval_time: 10m, alertname: DebitLagHigh, exp_alerts: []}

  # A lag above the healthy 190 s but not above the line (a slow run, a short backlog) is not the page; the line is strict.
  - name: DebitLagHigh stays quiet at exactly 300 s
    interval: 15s
    input_series:
      - {series: 'carmona_billing_debit_lag_seconds{job="billing", instance="10.0.0.8:8081"}', values: '300x60'}
    alert_rule_test:
      - {eval_time: 10m, alertname: DebitLagHigh, exp_alerts: []}

  # The two lag gauges are ABSENT, never 0, while their service cannot compute them (the database does not answer, billing
  # cannot reach usage-service): SealLagHigh and DebitLagHigh read nothing then, which is exactly when the pipeline is stuck.
  # The gauge is there at 0 for 2m, goes stale, and the service still answers its scrape: fires 5m after it left.
  - name: LagGaugeMissing fires 5m after a live usage-service stops reporting the seal lag, and names the replica
    interval: 15s
    input_series:
      - {series: 'up{job="usage", instance="10.0.0.7:8081"}', values: '1x80'}
      - {series: 'carmona_usage_seal_lag_seconds{job="usage", instance="10.0.0.7:8081"}', values: '0x8 stale _x80'}
      - {series: 'up{job="billing", instance="10.0.0.8:8081"}', values: '1x80'}
      - {series: 'carmona_billing_debit_lag_seconds{job="billing", instance="10.0.0.8:8081"}', values: '0x80'}
    alert_rule_test:
      - {eval_time: 7m, alertname: LagGaugeMissing, exp_alerts: []}
      - eval_time: 7m15s
        alertname: LagGaugeMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: usage, instance: "10.0.0.7:8081"}
            exp_annotations:
              summary: "usage 10.0.0.7:8081 answers its scrape but reports no lag gauge for 5m"
              description: >-
                The service is up and cannot compute its lag (the database does not answer, or for billing usage-service
                does not): the gauge is absent, not 0, so SealLagHigh and DebitLagHigh read nothing and a stuck
                pipeline would pass unnoticed. Check the service's log and the database it reads; a service that does
                not answer its scrape at all is ServiceDown.
      - eval_time: 15m
        alertname: LagGaugeMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: usage, instance: "10.0.0.7:8081"}
            exp_annotations:
              summary: "usage 10.0.0.7:8081 answers its scrape but reports no lag gauge for 5m"
              description: >-
                The service is up and cannot compute its lag (the database does not answer, or for billing usage-service
                does not): the gauge is absent, not 0, so SealLagHigh and DebitLagHigh read nothing and a stuck
                pipeline would pass unnoticed. Check the service's log and the database it reads; a service that does
                not answer its scrape at all is ServiceDown.

  - name: LagGaugeMissing covers billing's debit lag gauge too
    interval: 15s
    input_series:
      - {series: 'up{job="usage", instance="10.0.0.7:8081"}', values: '1x80'}
      - {series: 'carmona_usage_seal_lag_seconds{job="usage", instance="10.0.0.7:8081"}', values: '0x80'}
      - {series: 'up{job="billing", instance="10.0.0.8:8081"}', values: '1x80'}
    alert_rule_test:
      - {eval_time: 4m45s, alertname: LagGaugeMissing, exp_alerts: []}
      - eval_time: 5m
        alertname: LagGaugeMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: billing, instance: "10.0.0.8:8081"}
            exp_annotations:
              summary: "billing 10.0.0.8:8081 answers its scrape but reports no lag gauge for 5m"
              description: >-
                The service is up and cannot compute its lag (the database does not answer, or for billing usage-service
                does not): the gauge is absent, not 0, so SealLagHigh and DebitLagHigh read nothing and a stuck
                pipeline would pass unnoticed. Check the service's log and the database it reads; a service that does
                not answer its scrape at all is ServiceDown.

  # A service that does not answer its scrape has no gauge for a plainer reason (ServiceDown names it): not this alert, for
  # either service.
  - name: LagGaugeMissing stays quiet while the service itself is down
    interval: 15s
    input_series:
      - {series: 'up{job="usage", instance="10.0.0.7:8081"}', values: '0x80'}
      - {series: 'up{job="billing", instance="10.0.0.8:8081"}', values: '0x80'}
    alert_rule_test:
      - {eval_time: 15m, alertname: LagGaugeMissing, exp_alerts: []}

  # One replica reports and the other does not: the one that does not is named, the other is not hidden by it (the match is by
  # instance, not by job alone).
  - name: LagGaugeMissing names the replica that has no gauge when another replica of the job has
    interval: 15s
    input_series:
      - {series: 'up{job="usage", instance="10.0.0.7:8081"}', values: '1x80'}
      - {series: 'carmona_usage_seal_lag_seconds{job="usage", instance="10.0.0.7:8081"}', values: '0x80'}
      - {series: 'up{job="usage", instance="10.0.0.9:8081"}', values: '1x80'}
      - {series: 'up{job="billing", instance="10.0.0.8:8081"}', values: '1x80'}
      - {series: 'carmona_billing_debit_lag_seconds{job="billing", instance="10.0.0.8:8081"}', values: '0x80'}
    alert_rule_test:
      - eval_time: 5m
        alertname: LagGaugeMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: usage, instance: "10.0.0.9:8081"}
            exp_annotations:
              summary: "usage 10.0.0.9:8081 answers its scrape but reports no lag gauge for 5m"
              description: >-
                The service is up and cannot compute its lag (the database does not answer, or for billing usage-service
                does not): the gauge is absent, not 0, so SealLagHigh and DebitLagHigh read nothing and a stuck
                pipeline would pass unnoticed. Check the service's log and the database it reads; a service that does
                not answer its scrape at all is ServiceDown.

  - name: LagGaugeMissing does not fire when the gauge is back before 5m
    interval: 15s
    input_series:
      - {series: 'up{job="usage", instance="10.0.0.7:8081"}', values: '1x80'}
      - {series: 'carmona_usage_seal_lag_seconds{job="usage", instance="10.0.0.7:8081"}', values: '_x19 0x60'}
      - {series: 'up{job="billing", instance="10.0.0.8:8081"}', values: '1x80'}
      - {series: 'carmona_billing_debit_lag_seconds{job="billing", instance="10.0.0.8:8081"}', values: '0x80'}
    alert_rule_test:
      - {eval_time: 5m, alertname: LagGaugeMissing, exp_alerts: []}
      - {eval_time: 15m, alertname: LagGaugeMissing, exp_alerts: []}

  # Queue wait is the time from a request being understood to its engine call starting (rate buckets, a paying tier's wait
  # for a slot, the lease script). Every request below waits between 1 s and 2 s (it is in the le="2" bucket and not in the
  # le="1" one) for the first 12 minutes, then gets in at once. The p95 of that is 1.95 s, over the 1 s line.
  # Series: +10 requests per 15 s scrape, the slow ones counted only from le="2" up, the quick ones in every bucket.
  # The alert is pending from the first scrape that has a rate (15 s) and the p95 stays over 1 s until the 5 m rate window
  # holds under 5% slow requests, about 4m45s after the switch at 12m15s.
  - name: QueueWaitHigh fires after 10m of a p95 over 1 s, names model and tier, and resolves when requests get in at once
    interval: 15s
    input_series:
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="0.5", model="m1", tier="standard"}', values: '0x48 10+10x200'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="1", model="m1", tier="standard"}', values: '0x48 10+10x200'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="2", model="m1", tier="standard"}', values: '0+10x250'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="+Inf", model="m1", tier="standard"}', values: '0+10x250'}
    alert_rule_test:
      - {eval_time: 10m, alertname: QueueWaitHigh, exp_alerts: []}
      - eval_time: 10m15s
        alertname: QueueWaitHigh
        exp_alerts:
          - exp_labels: {severity: warning, model: m1, tier: standard}
            exp_annotations:
              summary: "m1 standard requests wait 1.95s (p95) before the engine call starts, above 1s for 10m"
              description: >-
                Requests are admitted and then wait over a second between being understood and the engine call
                starting: a paying tier's wait for a free slot (at most admission-wait, 1.5 s, before it is refused),
                the rate-bucket and lease scripts, or a slow Valkey. If the engine is busy (running at its slots,
                waiting at its queue places) capacity is the cause: look at EngineQueueSustained and the tier's
                refusals. If the engine is idle, look at Valkey (LeaseStoreDown, its latency) and at inference-service's
                CPU. Refused requests are not in this number; PayingTierRefusals counts them.
      - {eval_time: 20m, alertname: QueueWaitHigh, exp_alerts: []}

  # Over the line for 7m30s (3 minutes of slow requests plus the time the 5 m window takes to forget them), under the 10m.
  - name: QueueWaitHigh does not fire when the wait is back under the line before 10m
    interval: 15s
    input_series:
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="0.5", model="m1", tier="standard"}', values: '0x12 10+10x200'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="1", model="m1", tier="standard"}', values: '0x12 10+10x200'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="2", model="m1", tier="standard"}', values: '0+10x250'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="+Inf", model="m1", tier="standard"}', values: '0+10x250'}
    alert_rule_test:
      - {eval_time: 7m, alertname: QueueWaitHigh, exp_alerts: []}
      - {eval_time: 10m15s, alertname: QueueWaitHigh, exp_alerts: []}
      - {eval_time: 20m, alertname: QueueWaitHigh, exp_alerts: []}

  # A tier that gets in at once is quiet, and so is a tier nobody sends to: no requests means a rate of 0 and a quantile of
  # NaN, which is not over 1 (the alert does not page about traffic that is not there).
  - name: QueueWaitHigh stays quiet for a quick tier and for a tier without traffic
    interval: 15s
    input_series:
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="0.5", model="m1", tier="standard"}', values: '0+10x200'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="1", model="m1", tier="standard"}', values: '0+10x200'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="+Inf", model="m1", tier="standard"}', values: '0+10x200'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="0.5", model="m1", tier="trial"}', values: '5x200'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="1", model="m1", tier="trial"}', values: '5x200'}
      - {series: 'carmona_inference_queue_wait_seconds_bucket{le="+Inf", model="m1", tier="trial"}', values: '9x200'}
    alert_rule_test:
      - {eval_time: 15m, alertname: QueueWaitHigh, exp_alerts: []}

  # --- Edge review of the alerts that were already here --------------------------------------------------------------
  # Each alert gets the same three edges as the new ones: true for one scrape less than `for` never fires, true for `for`
  # exactly fires, and a series that goes back to normal resolves. (The cases above only checked a time well past `for`.)

  - name: ServiceDown fires after 2m exactly, not a scrape earlier, and resolves when the scrape answers
    interval: 15s
    input_series:
      - {series: 'up{job="usage", instance="10.0.0.9:8081"}', values: '0x8 1x30'}
    alert_rule_test:
      - {eval_time: 1m45s, alertname: ServiceDown, exp_alerts: []}
      - eval_time: 2m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels: {severity: critical, job: usage, instance: "10.0.0.9:8081"}
            exp_annotations:
              summary: "usage 10.0.0.9:8081 has not answered a scrape for 2m"
              description: >-
                Prometheus cannot reach 10.0.0.9:8081/actuator/prometheus (usage; one series per
                replica for inference and gateway, so this names the replica). The container may be down,
                still starting, or its management port not listening. Check the container's own health status
                and its logs. No metrics for this service means no SLI either.
      - {eval_time: 3m, alertname: ServiceDown, exp_alerts: []}

  - name: ServiceDown does not fire when the scrape answers again before 2m
    interval: 15s
    input_series:
      - {series: 'up{job="usage", instance="10.0.0.9:8081"}', values: '0x7 1x30'}
    alert_rule_test:
      - {eval_time: 2m, alertname: ServiceDown, exp_alerts: []}
      - {eval_time: 5m, alertname: ServiceDown, exp_alerts: []}

  # gateway is the one that never appeared; inference is present throughout.
  - name: ReplicatedServiceAbsent fires after 2m exactly and resolves when the service has a target again
    interval: 15s
    input_series:
      - {series: 'up{job="inference", instance="10.0.0.2:8081"}', values: '1x40'}
      - {series: 'up{job="gateway", instance="10.0.0.4:8081"}', values: '_x10 1x30'}
    alert_rule_test:
      - {eval_time: 1m45s, alertname: ReplicatedServiceAbsent, exp_alerts: []}
      - eval_time: 2m
        alertname: ReplicatedServiceAbsent
        exp_alerts:
          - exp_labels: {severity: critical, job: gateway}
            exp_annotations:
              summary: "gateway has no scrape target at all for 2m"
              description: >-
                No replica of gateway resolves any more (removed, or never started), so Prometheus has no target
                and no `up` series to alert on. Check `docker compose ps gateway`.
      - {eval_time: 4m, alertname: ReplicatedServiceAbsent, exp_alerts: []}

  - name: ReplicatedServiceAbsent does not fire when the target returns before 2m
    interval: 15s
    input_series:
      - {series: 'up{job="inference", instance="10.0.0.2:8081"}', values: '1x40'}
      - {series: 'up{job="gateway", instance="10.0.0.4:8081"}', values: '_x6 1x30'}
    alert_rule_test:
      - {eval_time: 2m, alertname: ReplicatedServiceAbsent, exp_alerts: []}
      - {eval_time: 5m, alertname: ReplicatedServiceAbsent, exp_alerts: []}

  # A stale marker ends a series at once (a container that went away), which is what makes the count drop at a known scrape.
  # The 30 m maximum still holds the two replicas until the drop is 30 m old: that clearing, after an intended scale-down
  # or a replacement, is the ponytail on the rule.
  - name: ReplicaMissing fires after 1m exactly and clears 30m after the replica left
    interval: 15s
    input_series:
      - {series: 'up{job="inference", instance="10.0.0.2:8081"}', values: '1x300'}
      - {series: 'up{job="inference", instance="10.0.0.3:8081"}', values: '1x40 stale'}
    alert_rule_test:
      - {eval_time: 10m, alertname: ReplicaMissing, exp_alerts: []}
      - {eval_time: 11m, alertname: ReplicaMissing, exp_alerts: []}
      - eval_time: 11m15s
        alertname: ReplicaMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: inference}
            exp_annotations:
              summary: "inference has fewer scrape targets than it had in the last 30m"
              description: >-
                A replica of inference no longer resolves or no longer exists, and the rest still answer, so no `up == 0`
                exists to alert on. Compare `docker compose ps inference` with the replicas you asked for.
      - {eval_time: 41m, alertname: ReplicaMissing, exp_alerts: []}

  - name: ReplicaMissing does not fire when the replica is back within a minute
    interval: 15s
    input_series:
      - {series: 'up{job="inference", instance="10.0.0.2:8081"}', values: '1x300'}
      - {series: 'up{job="inference", instance="10.0.0.3:8081"}', values: '1x40 stale _ _ 1x100'}
    alert_rule_test:
      - {eval_time: 12m, alertname: ReplicaMissing, exp_alerts: []}
      - {eval_time: 20m, alertname: ReplicaMissing, exp_alerts: []}

  # The GPU stack's engine is the `vllm` job: one target failing its scrape, and nothing else answering, is the outage.
  - name: EngineUnreachable fires after 1m exactly on the vllm job and resolves when it answers
    interval: 15s
    input_series:
      - {series: 'up{job="vllm", instance="10.0.0.5:8000"}', values: '0x4 1x40'}
    alert_rule_test:
      - {eval_time: 45s, alertname: EngineUnreachable, exp_alerts: []}
      - eval_time: 1m
        alertname: EngineUnreachable
        exp_alerts:
          - exp_labels: {severity: critical, job: vllm}
            exp_annotations:
              summary: "no model engine is reachable (vllm target down)"
              description: >-
                Every engine scrape is failing: inference-service will answer 503 once its one retry is spent.
                Check the engine container (the real one downloads the model on first start, which is slow but
                the container reports starting, not failing) and confirm the key in .env still matches the one
                the engine was started with.
      - {eval_time: 2m, alertname: EngineUnreachable, exp_alerts: []}

  - name: EngineUnreachable does not fire when the vllm scrape answers again before 1m
    interval: 15s
    input_series:
      - {series: 'up{job="vllm", instance="10.0.0.5:8000"}', values: '0x3 1x40'}
    alert_rule_test:
      - {eval_time: 1m, alertname: EngineUnreachable, exp_alerts: []}
      - {eval_time: 5m, alertname: EngineUnreachable, exp_alerts: []}

  # No engine target at all, then the vllm job appears (the card was rented and started): the absent branch resolves.
  - name: EngineUnreachable with no engine target resolves when a vllm target appears
    interval: 15s
    input_series:
      - {series: 'up{job="prometheus"}', values: '1x40'}
      - {series: 'up{job="vllm", instance="10.0.0.5:8000"}', values: '_x10 1x30'}
    alert_rule_test:
      - {eval_time: 45s, alertname: EngineUnreachable, exp_alerts: []}
      - eval_time: 1m
        alertname: EngineUnreachable
        exp_alerts:
          - exp_labels: {severity: critical, job: engine}
            exp_annotations:
              summary: "no model engine is reachable (engine target down)"
              description: >-
                Every engine scrape is failing: inference-service will answer 503 once its one retry is spent.
                Check the engine container (the real one downloads the model on first start, which is slow but
                the container reports starting, not failing) and confirm the key in .env still matches the one
                the engine was started with.
      - {eval_time: 3m, alertname: EngineUnreachable, exp_alerts: []}

  # ReconciliationMismatch has no `for`: the hourly reconcile is the only evidence and it is already a measurement over an
  # hour, so a 1 fires at the first scrape that shows it. Any replica reporting it is enough (max by model).
  - name: ReconciliationMismatch fires at the first scrape showing 1 and resolves when it reads 0
    interval: 15s
    input_series:
      - {series: 'carmona_inference_reconcile_mismatch{job="inference", instance="10.0.0.2:8081", model="m1"}', values: '0x20'}
      - {series: 'carmona_inference_reconcile_mismatch{job="inference", instance="10.0.0.3:8081", model="m1"}', values: '0x4 1x4 0x20'}
    alert_rule_test:
      - {eval_time: 1m, alertname: ReconciliationMismatch, exp_alerts: []}
      - eval_time: 1m15s
        alertname: ReconciliationMismatch
        exp_alerts:
          - exp_labels: {severity: critical, model: m1}
            exp_annotations:
              summary: "engine counters and stored usage disagree for m1"
              description: >-
                Tokens the engine processed are not in usage-service: they will never be billed. Call
                GET /actuator/reconcile on inference-service (management port, internal network) for the delta,
                and check usage-service's ingestion errors and the usage:events stream in Valkey.
      - {eval_time: 3m, alertname: ReconciliationMismatch, exp_alerts: []}

  # Requests keep arriving at inference-service (+10 per scrape). usage-service receives events (+10 per scrape) for the first
  # two minutes and then none: its 5 m rate reaches 0 at 6m45s, the alert is pending from there and fires 5m later, at 11m45s.
  # It resolves when the events flow again (from 17m30s).
  - name: UsageIngestionStalled fires 5m after the usage rate hits zero and resolves when events flow again
    interval: 15s
    input_series:
      - {series: 'http_server_requests_seconds_count{job="inference", uri="/v1/chat/completions", status="200"}', values: '0+10x200'}
      - {series: 'http_server_requests_seconds_count{job="usage", uri="/usage/events", status="200"}', values: '0+10x8 80x60 90+10x100'}
    alert_rule_test:
      - {eval_time: 11m30s, alertname: UsageIngestionStalled, exp_alerts: []}
      - eval_time: 11m45s
        alertname: UsageIngestionStalled
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "requests are being served and no usage event is reaching usage-service"
              description: >-
                inference-service is answering /v1/chat/completions while usage-service has received nothing for
                5 m: every one of those requests is unbilled. Check the usage container, then the usage:events
                stream in Valkey (inference-service retries from there, so events are not lost yet -- a full
                stream or a dead relay is what to look for).
      - {eval_time: 18m, alertname: UsageIngestionStalled, exp_alerts: []}

  # The events come back after 4 minutes of silence, one minute under the 5 m: pending, never firing.
  - name: UsageIngestionStalled does not fire when events resume before 5m
    interval: 15s
    input_series:
      - {series: 'http_server_requests_seconds_count{job="inference", uri="/v1/chat/completions", status="200"}', values: '0+10x200'}
      - {series: 'http_server_requests_seconds_count{job="usage", uri="/usage/events", status="200"}', values: '0+10x8 80x35 90+10x100'}
    alert_rule_test:
      - {eval_time: 12m, alertname: UsageIngestionStalled, exp_alerts: []}
      - {eval_time: 20m, alertname: UsageIngestionStalled, exp_alerts: []}

  # No requests, no events: the service is idle, not leaking.
  - name: UsageIngestionStalled stays quiet while nobody sends requests
    interval: 15s
    input_series:
      - {series: 'http_server_requests_seconds_count{job="inference", uri="/v1/chat/completions", status="200"}', values: '50x100'}
      - {series: 'http_server_requests_seconds_count{job="usage", uri="/usage/events", status="200"}', values: '80x100'}
    alert_rule_test:
      - {eval_time: 20m, alertname: UsageIngestionStalled, exp_alerts: []}

  # 6% of the requests fail (6 of 100 per scrape) for the first 10 minutes, then none. Pending from the first scrape that
  # has a rate (15 s), so it fires at 5m15s and not at 5m; the 5 m window forgets the failures by 12m.
  - name: ErrorShareHigh fires after 5m above 5 percent and resolves when the failures stop
    interval: 15s
    input_series:
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="error", code="engine_error"}', values: '0+6x40 240x100'}
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="ok", code="none"}', values: '0+94x40 3860+100x100'}
    alert_rule_test:
      - {eval_time: 5m, alertname: ErrorShareHigh, exp_alerts: []}
      - eval_time: 5m15s
        alertname: ErrorShareHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "more than 5% of inference requests have failed for 5m"
              description: >-
                outcome="error" over the last 5 m is above the goodput line. The code tag tells the story:
                502/503 are the engine or the pool, 500 is a defect in inference-service. Check the engine's
                own panels (running, waiting, cache) and the service's logs.
      - {eval_time: 12m, alertname: ErrorShareHigh, exp_alerts: []}

  # The failures last 3 minutes: over 5% for under 4 minutes, so never the 5 m.
  - name: ErrorShareHigh does not fire when the failures stop before 5m
    interval: 15s
    input_series:
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="error", code="engine_error"}', values: '0+6x12 72x100'}
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="ok", code="none"}', values: '0+94x12 1128+100x100'}
    alert_rule_test:
      - {eval_time: 5m15s, alertname: ErrorShareHigh, exp_alerts: []}
      - {eval_time: 10m, alertname: ErrorShareHigh, exp_alerts: []}

  # The line is strict: exactly 5% for as long as it lasts is not an alert.
  - name: ErrorShareHigh stays quiet at exactly 5 percent
    interval: 15s
    input_series:
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="error", code="engine_error"}', values: '0+5x100'}
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="ok", code="none"}', values: '0+95x100'}
    alert_rule_test:
      - {eval_time: 15m, alertname: ErrorShareHigh, exp_alerts: []}

  # 10% of the standard tier's requests are answered model_busy (10 of 100 per scrape) for 10 minutes, then none. The trial tier
  # is refused half the time by design and an enterprise tier with no refusals has no numerator: neither is named.
  - name: PayingTierRefusals fires after 5m above 5 percent for the tier, and resolves when the refusals stop
    interval: 15s
    input_series:
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="error", code="model_busy"}', values: '0+10x40 400x100'}
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="ok", code="none"}', values: '0+90x40 3600+100x100'}
      - {series: 'carmona_inference_requests_total{model="m1", tier="enterprise", outcome="ok", code="none"}', values: '0+100x140'}
      - {series: 'carmona_inference_requests_total{model="m1", tier="trial", outcome="error", code="rate_limit_exceeded"}', values: '0+50x140'}
      - {series: 'carmona_inference_requests_total{model="m1", tier="trial", outcome="ok", code="none"}', values: '0+50x140'}
    alert_rule_test:
      - {eval_time: 5m, alertname: PayingTierRefusals, exp_alerts: []}
      - eval_time: 5m15s
        alertname: PayingTierRefusals
        exp_alerts:
          - exp_labels: {severity: warning, tier: standard}
            exp_annotations:
              summary: "standard is being refused more than 5% of the time for 5m"
              description: >-
                A paying tier is hitting model_busy or rate_limit_exceeded beyond the 95% goodput the phase-4
                exit check demands. Trial is shed first by design, so refusals there are not this alert: here it
                is capacity (C), a tier's share, or one organization holding the slots (VTC, gap 4).
      - {eval_time: 13m, alertname: PayingTierRefusals, exp_alerts: []}

  # Refused for 2 minutes: over 5% until the 5 m window dilutes it, at about 4 minutes, so never the 5 m.
  - name: PayingTierRefusals does not fire when the refusals stop before 5m
    interval: 15s
    input_series:
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="error", code="model_busy"}', values: '0+10x8 80x100'}
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="ok", code="none"}', values: '0+90x8 720+100x100'}
    alert_rule_test:
      - {eval_time: 5m15s, alertname: PayingTierRefusals, exp_alerts: []}
      - {eval_time: 10m, alertname: PayingTierRefusals, exp_alerts: []}

  # Engine failures are ErrorShareHigh's, and exactly 5% is not over the line.
  - name: PayingTierRefusals ignores engine errors and stays quiet at exactly 5 percent
    interval: 15s
    input_series:
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="error", code="engine_error"}', values: '0+30x100'}
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="error", code="model_busy"}', values: '0+5x100'}
      - {series: 'carmona_inference_requests_total{model="m1", tier="standard", outcome="ok", code="none"}', values: '0+65x100'}
    alert_rule_test:
      - {eval_time: 15m, alertname: PayingTierRefusals, exp_alerts: []}

  # --- Alerts on the signals of the DeepInfer packages (WP-03, WP-07, WP-08, WP-09B; WP-14B) --------------------------------
  # Every inference-service replica exports these metrics, so each case feeds two replicas ("10.0.0.2" and "10.0.0.3") and the
  # alert must name the engine replica once, not once per reporter. YAML anchors keep one copy of each annotation text per alert.

  # The health gate's opinion (WP-08) is per inference-service JVM; the alert takes the most pessimistic one (max by), so a JVM that
  # cannot reach the engine while another can still says so. Value 1 = unhealthy. replica is the engine replica's place in the list.
  - name: ReplicaUnhealthy fires after 1m, names model and replica once, and resolves when the replica is back
    interval: 15s
    input_series:
      - {series: 'carmona_replica_health_state{job="inference", instance="10.0.0.2:8081", model="carmona/qwen3-4b", replica="0"}', values: '1x12 0x20'}
      - {series: 'carmona_replica_health_state{job="inference", instance="10.0.0.3:8081", model="carmona/qwen3-4b", replica="0"}', values: '1x12 0x20'}
      - {series: 'carmona_replica_health_state{job="inference", instance="10.0.0.2:8081", model="carmona/qwen3-4b", replica="1"}', values: '0x32'}
      - {series: 'carmona_replica_health_state{job="inference", instance="10.0.0.3:8081", model="carmona/qwen3-4b", replica="1"}', values: '0x32'}
    alert_rule_test:
      - {eval_time: 45s, alertname: ReplicaUnhealthy, exp_alerts: []}
      - eval_time: 1m
        alertname: ReplicaUnhealthy
        exp_alerts:
          - exp_labels: {severity: warning, model: carmona/qwen3-4b, replica: "0"}
            exp_annotations:
              summary: "replica 0 of carmona/qwen3-4b is out of rotation (unhealthy) for 1m"
              description: &unhealthy-text >-
                inference-service's health gate stopped sending requests to this engine replica because nobody answered it:
                three scrapes of its /metrics in a row, or three refused connections while no scrape answered. This takes the
                most pessimistic opinion of the inference-service replicas. If it is the model's only replica, every request is
                a 503 engine_unavailable right now (EngineUnreachable fires too); with more, the others take its share. Check the
                engine container: an engine that is loading its model is unreachable for minutes and returns by itself after two
                answered scrapes, nothing needs resetting. Then the engine's own log.
      - {eval_time: 4m, alertname: ReplicaUnhealthy, exp_alerts: []}

  # One JVM sees the replica ready (it scraped it a moment ago) while the other has it out: the alert still fires.
  - name: ReplicaUnhealthy fires when only one inference-service replica has the engine replica out
    interval: 15s
    input_series:
      - {series: 'carmona_replica_health_state{job="inference", instance="10.0.0.2:8081", model="m1", replica="0"}', values: '0x20'}
      - {series: 'carmona_replica_health_state{job="inference", instance="10.0.0.3:8081", model="m1", replica="0"}', values: '1x20'}
    alert_rule_test:
      - eval_time: 1m
        alertname: ReplicaUnhealthy
        exp_alerts:
          - exp_labels: {severity: warning, model: m1, replica: "0"}
            exp_annotations:
              summary: "replica 0 of m1 is out of rotation (unhealthy) for 1m"
              description: *unhealthy-text

  - name: ReplicaUnhealthy does not fire when the replica is back before a minute is up
    interval: 15s
    input_series:
      - {series: 'carmona_replica_health_state{job="inference", instance="10.0.0.2:8081", model="m1", replica="0"}', values: '1x3 0x20'}
    alert_rule_test:
      - {eval_time: 45s, alertname: ReplicaUnhealthy, exp_alerts: []}
      - {eval_time: 1m, alertname: ReplicaUnhealthy, exp_alerts: []}
      - {eval_time: 3m, alertname: ReplicaUnhealthy, exp_alerts: []}

  # The gauge exists only while the gate is on (carmona.inference.health.enabled): with the gate off there is no series, no alert.
  - name: ReplicaUnhealthy and ReplicaWentUnhealthy are silent when the gate is off and the series do not exist
    interval: 15s
    input_series:
      - {series: 'up{job="inference", instance="10.0.0.2:8081"}', values: '1x40'}
    alert_rule_test:
      - {eval_time: 10m, alertname: ReplicaUnhealthy, exp_alerts: []}
      - {eval_time: 10m, alertname: ReplicaWentUnhealthy, exp_alerts: []}

  # The gauge is sampled every 15 s and the gate needs 15 s of silence to go out and two answered scrapes to come back, so a
  # replica can be out for a moment between two scrapes. The counter of transitions keeps that moment: both inference-service
  # replicas count it, the sum names the model once and the alert has no `for` (the event is already over by then). Counters are
  # born at 0 (HealthMetrics), so the first outage of a JVM's life is an increase too.
  - name: ReplicaWentUnhealthy fires at the first scrape that shows a transition, stays while the window holds it, and resolves
    interval: 15s
    input_series:
      - {series: 'carmona_replica_health_transitions_total{job="inference", instance="10.0.0.2:8081", model="m1", to="unhealthy"}', values: '0x8 1x80'}
      - {series: 'carmona_replica_health_transitions_total{job="inference", instance="10.0.0.3:8081", model="m1", to="unhealthy"}', values: '0x8 1x80'}
      - {series: 'carmona_replica_health_transitions_total{job="inference", instance="10.0.0.2:8081", model="m1", to="ready"}', values: '0x8 1x80'}
    alert_rule_test:
      - {eval_time: 2m, alertname: ReplicaWentUnhealthy, exp_alerts: []}
      - eval_time: 2m15s
        alertname: ReplicaWentUnhealthy
        exp_alerts:
          - exp_labels: {severity: warning, model: m1}
            exp_annotations:
              summary: "a replica of m1 was taken out of rotation in the last 10m"
              description: &went-text >-
                inference-service marked an engine replica unhealthy at least once in the last 10 minutes. ReplicaUnhealthy
                samples the state every 15 s, so an outage that began and ended between two scrapes (an engine restart, a
                network blip) shows only here. Once is an incident, a repeat is a flapping engine or a flaky link: look at the
                engine container's restarts and uptime (docker compose ps) and at the network between inference and the engine.
      - eval_time: 10m
        alertname: ReplicaWentUnhealthy
        exp_alerts:
          - exp_labels: {severity: warning, model: m1}
            exp_annotations:
              summary: "a replica of m1 was taken out of rotation in the last 10m"
              description: *went-text
      - {eval_time: 13m, alertname: ReplicaWentUnhealthy, exp_alerts: []}

  # A replica coming back is not an incident: only the `to="unhealthy"` series counts.
  - name: ReplicaWentUnhealthy ignores transitions to ready
    interval: 15s
    input_series:
      - {series: 'carmona_replica_health_transitions_total{job="inference", instance="10.0.0.2:8081", model="m1", to="unhealthy"}', values: '0x80'}
      - {series: 'carmona_replica_health_transitions_total{job="inference", instance="10.0.0.2:8081", model="m1", to="ready"}', values: '0x8 1x80'}
    alert_rule_test:
      - {eval_time: 5m, alertname: ReplicaWentUnhealthy, exp_alerts: []}

  # WP-09B: overdue is 1 while a DRAINING replica is past its grace with requests still on it. Every inference-service replica
  # exports the same fleet-wide number (the leases are in Valkey), so the alert takes the max: a sum of two reporters would read 2
  # and a `== 1` on it would be silent exactly when two JVMs run.
  - name: ReplicaDrainOverdue fires after 2m on two reporters at once, names model and replica, and resolves when the last stream ends
    interval: 15s
    input_series:
      - {series: 'carmona_replica_drain_overdue{job="inference", instance="10.0.0.2:8081", model="carmona/qwen3-4b", replica="1"}', values: '1x16 0x20'}
      - {series: 'carmona_replica_drain_overdue{job="inference", instance="10.0.0.3:8081", model="carmona/qwen3-4b", replica="1"}', values: '1x16 0x20'}
      - {series: 'carmona_replica_drain_overdue{job="inference", instance="10.0.0.2:8081", model="carmona/qwen3-4b", replica="0"}', values: '0x36'}
      - {series: 'carmona_replica_drain_overdue{job="inference", instance="10.0.0.3:8081", model="carmona/qwen3-4b", replica="0"}', values: '0x36'}
    alert_rule_test:
      - {eval_time: 1m45s, alertname: ReplicaDrainOverdue, exp_alerts: []}
      - eval_time: 2m
        alertname: ReplicaDrainOverdue
        exp_alerts:
          - exp_labels: {severity: warning, model: carmona/qwen3-4b, replica: "1"}
            exp_annotations:
              summary: "replica 1 of carmona/qwen3-4b is past its drain grace with requests still running for 2m"
              description: &drain-text >-
                An operator drained this engine replica (POST /actuator/drain) and its grace has passed, but requests are still
                running on it. Carmona never cuts them: it takes no new request and waits. GET /actuator/drain on the inference
                management port shows inFlight and drained for the replica. Either wait for the streams, or destroy the card and
                accept that the rest end with an error event and are billed what they had produced. The engine is working; this
                is not a failure of it.
      - {eval_time: 6m, alertname: ReplicaDrainOverdue, exp_alerts: []}

  - name: ReplicaDrainOverdue does not fire when the last stream ends before 2m
    interval: 15s
    input_series:
      - {series: 'carmona_replica_drain_overdue{job="inference", instance="10.0.0.2:8081", model="m1", replica="1"}', values: '1x6 0x20'}
    alert_rule_test:
      - {eval_time: 1m45s, alertname: ReplicaDrainOverdue, exp_alerts: []}
      - {eval_time: 2m, alertname: ReplicaDrainOverdue, exp_alerts: []}
      - {eval_time: 5m, alertname: ReplicaDrainOverdue, exp_alerts: []}

  # A draining replica inside its grace (overdue 0, requests in flight) is the drain working, not an alert.
  - name: ReplicaDrainOverdue stays quiet while the drain is inside its grace
    interval: 15s
    input_series:
      - {series: 'carmona_replica_drain_overdue{job="inference", instance="10.0.0.2:8081", model="m1", replica="1"}', values: '0x40'}
      - {series: 'carmona_replica_drain_inflight{job="inference", instance="10.0.0.2:8081", model="m1", replica="1"}', values: '3x40'}
    alert_rule_test:
      - {eval_time: 10m, alertname: ReplicaDrainOverdue, exp_alerts: []}

  # The reporters sample at their own moments (every 5 s) and one of them can be a JVM that has not sampled yet, or whose call to Valkey
  # failed (NaN, never 0). One reporter that sees the overdue drain is enough, so the alert is max and not min or avg: a 0 from a
  # reporter that has not caught up must not hide it, and a NaN is not an answer at all.
  - name: ReplicaDrainOverdue fires when only one inference-service replica reports it, whatever the others say
    interval: 15s
    input_series:
      - {series: 'carmona_replica_drain_overdue{job="inference", instance="10.0.0.2:8081", model="m1", replica="1"}', values: '1x20'}
      - {series: 'carmona_replica_drain_overdue{job="inference", instance="10.0.0.3:8081", model="m1", replica="1"}', values: '0x20'}
      - {series: 'carmona_replica_drain_overdue{job="inference", instance="10.0.0.4:8081", model="m1", replica="1"}', values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'}
    alert_rule_test:
      - eval_time: 2m
        alertname: ReplicaDrainOverdue
        exp_alerts:
          - exp_labels: {severity: warning, model: m1, replica: "1"}
            exp_annotations:
              summary: "replica 1 of m1 is past its drain grace with requests still running for 2m"
              description: *drain-text

  - name: ReplicaDrainOverdue is silent when no reporter can say (NaN, Valkey does not answer)
    interval: 15s
    input_series:
      - {series: 'carmona_replica_drain_overdue{job="inference", instance="10.0.0.2:8081", model="m1", replica="1"}', values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'}
    alert_rule_test:
      - {eval_time: 10m, alertname: ReplicaDrainOverdue, exp_alerts: []}

  # WP-03: carmona_engine_contract_ok is 1 (the engine meets the check), 0 (it does not), and ABSENT while the check cannot be made,
  # so a 0 is always a real mismatch. min by: one inference-service replica reading 0 is enough. The label `check` names it.
  - name: EngineContractMismatch fires after 5m, names the check, and resolves when the engine is fixed
    interval: 15s
    input_series:
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="carmona/qwen3-4b", replica="0", check="models_len"}', values: '0x24 1x40'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.3:8081", model="carmona/qwen3-4b", replica="0", check="models_len"}', values: '0x24 1x40'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="carmona/qwen3-4b", replica="0", check="metrics"}', values: '1x64'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.3:8081", model="carmona/qwen3-4b", replica="0", check="metrics"}', values: '1x64'}
    alert_rule_test:
      - {eval_time: 4m45s, alertname: EngineContractMismatch, exp_alerts: []}
      - eval_time: 5m
        alertname: EngineContractMismatch
        exp_alerts:
          - exp_labels: {severity: warning, model: carmona/qwen3-4b, replica: "0", check: models_len}
            exp_annotations:
              summary: "engine replica 0 of carmona/qwen3-4b fails the contract check models_len for 5m"
              description: &contract-text >-
                What Carmona assumes about the engine and what the engine reports disagree; nothing is refused because of it,
                the service keeps running. The check label says which: models (the served model id is not in /v1/models),
                models_len (the engine's max_model_len is below the context-window), metrics (a required metric family is
                missing), kv_tokens (no KV-cache size reported), capacity (a full-context request takes more than the capacity
                ratio of the KV cache), prefix_caching (prefix caching is off, and the shared-prefix workload depends on it).
                inference-service logs one WARN with the numbers when a check starts to fail, and looks again every
                recheck-every (10 m), so this clears by itself some minutes after the engine's flags are fixed.
      - {eval_time: 10m, alertname: EngineContractMismatch, exp_alerts: []}

  - name: EngineContractMismatch fires when only one inference-service replica reads 0
    interval: 15s
    input_series:
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m1", replica="0", check="capacity"}', values: '1x40'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.3:8081", model="m1", replica="0", check="capacity"}', values: '0x40'}
    alert_rule_test:
      - eval_time: 5m
        alertname: EngineContractMismatch
        exp_alerts:
          - exp_labels: {severity: warning, model: m1, replica: "0", check: capacity}
            exp_annotations:
              summary: "engine replica 0 of m1 fails the contract check capacity for 5m"
              description: *contract-text

  - name: EngineContractMismatch does not fire when the check passes again before 5m, or when no check has run
    interval: 15s
    input_series:
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m1", replica="0", check="models"}', values: '0x18 1x40'}
      - {series: 'up{job="inference", instance="10.0.0.3:8081"}', values: '1x60'}
    alert_rule_test:
      - {eval_time: 4m45s, alertname: EngineContractMismatch, exp_alerts: []}
      - {eval_time: 5m, alertname: EngineContractMismatch, exp_alerts: []}
      - {eval_time: 10m, alertname: EngineContractMismatch, exp_alerts: []}

  # WP-07: the guard's two counters. Hard-class control strings (the chat template's role markers) in client text are neutralized by
  # default, so this is a signal and not a failure; the soft class (think and tool tags) is what a client replaying the model's own
  # reasoning sends on every turn and never alerts. One minute per sample here: the window is an hour.
  - name: ControlTokensInContent fires on a hard-class string within the hour and resolves after it, for both actions
    interval: 1m
    input_series:
      - {series: 'carmona_inference_control_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", class="hard", action="neutralized"}', values: '0x10 3x200'}
      - {series: 'carmona_inference_control_tokens_total{job="inference", instance="10.0.0.3:8081", model="m1", class="hard", action="neutralized"}', values: '0x200'}
      - {series: 'carmona_inference_control_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", class="hard", action="rejected"}', values: '0x200'}
    alert_rule_test:
      - {eval_time: 10m, alertname: ControlTokensInContent, exp_alerts: []}
      - eval_time: 11m
        alertname: ControlTokensInContent
        exp_alerts:
          - exp_labels: {severity: info, model: m1}
            exp_annotations:
              summary: "client text for m1 held a hard control-token string in the last hour"
              description: &control-text >-
                A message or tool definition held a string that looks like the chat template's role markers (the hard class:
                an angle bracket and a pipe, a short name, a pipe and an angle bracket). By default the guard neutralizes it
                (a zero-width character goes after the first character, the visible text is unchanged, nothing is refused), so
                this is a signal and not a failure: a document that quotes a template, or an injection attempt. No organization
                is on the metric on purpose; ask the customer or look for the time in the access log. Whether a model should
                reject instead is decided after the GPU day check G-05, not by this alert.
      - eval_time: 50m
        alertname: ControlTokensInContent
        exp_alerts:
          - exp_labels: {severity: info, model: m1}
            exp_annotations:
              summary: "client text for m1 held a hard control-token string in the last hour"
              description: *control-text
      - {eval_time: 70m, alertname: ControlTokensInContent, exp_alerts: []}

  - name: ControlTokensInContent ignores the soft class
    interval: 1m
    input_series:
      - {series: 'carmona_inference_control_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", class="soft", action="neutralized"}', values: '0x10 500x100'}
    alert_rule_test:
      - {eval_time: 30m, alertname: ControlTokensInContent, exp_alerts: []}

  # One string is the signal: a client that quotes a chat template once, or one injection attempt, is already worth a look.
  - name: ControlTokensInContent fires on a single hard-class string
    interval: 1m
    input_series:
      - {series: 'carmona_inference_control_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", class="hard", action="neutralized"}', values: '0x10 1x100'}
    alert_rule_test:
      - {eval_time: 10m, alertname: ControlTokensInContent, exp_alerts: []}
      - eval_time: 11m
        alertname: ControlTokensInContent
        exp_alerts:
          - exp_labels: {severity: info, model: m1}
            exp_annotations:
              summary: "client text for m1 held a hard control-token string in the last hour"
              description: *control-text

  # Rejections reach the client as a 400 each. One stray request is not a stuck client: ten in ten minutes is. `increase` extrapolates
  # to the window, so the line is read with a margin (12 fires, 5 does not) and not at the boundary.
  - name: GuardRejections fires on ten or more refusals in ten minutes, names model and code, and resolves
    interval: 15s
    input_series:
      - {series: 'carmona_inference_guard_rejected_total{job="inference", instance="10.0.0.2:8081", model="m1", guard="control_tokens", code="invalid_role"}', values: '0x8 6x100'}
      - {series: 'carmona_inference_guard_rejected_total{job="inference", instance="10.0.0.3:8081", model="m1", guard="control_tokens", code="invalid_role"}', values: '0x8 6x100'}
      - {series: 'carmona_inference_guard_rejected_total{job="inference", instance="10.0.0.2:8081", model="m1", guard="control_tokens", code="nesting_too_deep"}', values: '0x8 5x100'}
    alert_rule_test:
      - {eval_time: 2m, alertname: GuardRejections, exp_alerts: []}
      - eval_time: 2m15s
        alertname: GuardRejections
        exp_alerts:
          - exp_labels: {severity: warning, model: m1, code: invalid_role}
            exp_annotations:
              summary: "the request guard answered 400 invalid_role on m1 at least ten times in 10m"
              description: &guard-text >-
                A client keeps sending requests the guard refuses: invalid_role (a message role outside the accepted list, for
                example developer, which stays out until G-05), nesting_too_deep, or control_token_in_content (only for a model
                whose hard-mode or soft-mode is reject). The customer gets a 400 for each, so a new SDK or a changed template is
                the first thing to look for. The 400 text names the problem and never repeats the content; no organization is
                on any metric, so the client is found from the customer's side or from the access log by time.
      - {eval_time: 20m, alertname: GuardRejections, exp_alerts: []}

  # Two refusals a minute is a client that is stuck, though no single minute looks like much: the window is the ten minutes.
  - name: GuardRejections counts refusals spread over the whole window
    interval: 1m
    input_series:
      - {series: 'carmona_inference_guard_rejected_total{job="inference", instance="10.0.0.2:8081", model="m1", guard="control_tokens", code="invalid_role"}', values: '0+2x40'}
    alert_rule_test:
      - eval_time: 12m
        alertname: GuardRejections
        exp_alerts:
          - exp_labels: {severity: warning, model: m1, code: invalid_role}
            exp_annotations:
              summary: "the request guard answered 400 invalid_role on m1 at least ten times in 10m"
              description: *guard-text

  - name: GuardRejections stays quiet on a few refusals
    interval: 15s
    input_series:
      - {series: 'carmona_inference_guard_rejected_total{job="inference", instance="10.0.0.2:8081", model="m1", guard="control_tokens", code="invalid_role"}', values: '0x8 5x100'}
    alert_rule_test:
      - {eval_time: 8m, alertname: GuardRejections, exp_alerts: []}

  # The GPU stack's engine is the `vllm` job: losing one of two replicas leaves the other answering, so EngineUnreachable is quiet
  # and `up == 0` may not exist (discovery drops the name). ReplicaMissing has to watch this job too.
  - name: ReplicaMissing watches the vllm job and fires after 1m when one of two replicas leaves discovery
    interval: 15s
    input_series:
      - {series: 'up{job="vllm", instance="10.0.0.5:8000"}', values: '1x120'}
      - {series: 'up{job="vllm", instance="10.0.0.6:8000"}', values: '1x20 stale'}
    alert_rule_test:
      - {eval_time: 6m, alertname: ReplicaMissing, exp_alerts: []}
      - eval_time: 6m15s
        alertname: ReplicaMissing
        exp_alerts:
          - exp_labels: {severity: warning, job: vllm}
            exp_annotations:
              summary: "vllm has fewer scrape targets than it had in the last 30m"
              description: >-
                A replica of vllm no longer resolves or no longer exists, and the rest still answer, so no `up == 0`
                exists to alert on. Compare `docker compose ps vllm` with the replicas you asked for.

  # --- P0-1b: the prompt cache hit ratio (carmona_inference_prompt_cache_tokens_total, counted once per request by inference-service) ----
  # The counter has the labels model, mode and result (hit, miss); every inference-service replica counts its own requests, so the rules
  # sum the replicas. Values below are per 15 s scrape; at 31 m both the 15 m and the 30 m window are full, so a rate is the slope.

  # Recording rules: exact values, by model and mode, summed over the replicas. m1 sync is two replicas (375+1125 tokens each
  # per scrape: 25% hit, 3000 tokens per scrape = 200 tokens/s); m1 batch is 75% on one replica (1500 tokens per scrape); m2 sync is 30% (also 1500).
  - name: prompt_cache records are the hit ratio and the measured token rate per model and mode, summed over the replicas
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0+375x130'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+1125x130'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.3:8081", model="m1", mode="sync", result="hit"}', values: '0+375x130'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.3:8081", model="m1", mode="sync", result="miss"}', values: '0+1125x130'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="batch", result="hit"}', values: '0+1125x130'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="batch", result="miss"}', values: '0+375x130'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="hit"}', values: '0+450x130'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="miss"}', values: '0+1050x130'}
    promql_expr_test:
      - expr: prompt_cache:hit_ratio_15m
        eval_time: 31m
        exp_samples:
          - {labels: 'prompt_cache:hit_ratio_15m{model="m1", mode="sync"}', value: 0.25}
          - {labels: 'prompt_cache:hit_ratio_15m{model="m1", mode="batch"}', value: 0.75}
          - {labels: 'prompt_cache:hit_ratio_15m{model="m2", mode="sync"}', value: 0.3}
      - expr: prompt_cache:tokens_rate_15m
        eval_time: 31m
        exp_samples:
          - {labels: 'prompt_cache:tokens_rate_15m{model="m1", mode="sync"}', value: 200}
          - {labels: 'prompt_cache:tokens_rate_15m{model="m1", mode="batch"}', value: 100}
          - {labels: 'prompt_cache:tokens_rate_15m{model="m2", mode="sync"}', value: 100}
      - expr: prompt_cache:hit_ratio_30m
        eval_time: 31m
        exp_samples:
          - {labels: 'prompt_cache:hit_ratio_30m{model="m1", mode="sync"}', value: 0.25}
          - {labels: 'prompt_cache:hit_ratio_30m{model="m1", mode="batch"}', value: 0.75}
          - {labels: 'prompt_cache:hit_ratio_30m{model="m2", mode="sync"}', value: 0.3}
      - expr: prompt_cache:tokens_30m
        eval_time: 31m
        exp_samples:
          - {labels: 'prompt_cache:tokens_30m{model="m1", mode="sync"}', value: 360000}
          - {labels: 'prompt_cache:tokens_30m{model="m1", mode="batch"}', value: 180000}
          - {labels: 'prompt_cache:tokens_30m{model="m2", mode="sync"}', value: 180000}

  # The two windows are different windows. Counters start at 10 million so no rate is cut at zero. For the first 15 minutes every scrape
  # adds 59000 miss tokens, then every scrape adds 60000 hit tokens. At 30 m the last 15 m is all hits (ratio 1) and the 30 m window
  # holds 60 scrapes of misses and 59 of hits, 3.54 million tokens each (the first scrape of a window only starts the count): 0.5. The
  # 15 m rate is the 60000 tokens of a scrape every 15 s, 4000 tokens/s.
  - name: prompt_cache ratios of 15 m and 30 m read their own window
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '10000000x61 10060000+60000x60'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '10000000+59000x61 13599000x61'}
    promql_expr_test:
      - expr: prompt_cache:hit_ratio_15m
        eval_time: 30m
        exp_samples:
          - {labels: 'prompt_cache:hit_ratio_15m{model="m1", mode="sync"}', value: 1}
      - expr: prompt_cache:hit_ratio_30m
        eval_time: 30m
        exp_samples:
          - {labels: 'prompt_cache:hit_ratio_30m{model="m1", mode="sync"}', value: 0.5}
      - expr: prompt_cache:tokens_rate_15m
        eval_time: 30m
        exp_samples:
          - {labels: 'prompt_cache:tokens_rate_15m{model="m1", mode="sync"}', value: 4000}

  # 40000 tokens/s measured (600000 per scrape: over the floor from the first scrape that has a rate), 20% of them hits for the first
  # 20 minutes, then 80%. Pending from that scrape (15 s), so it fires at 15m15s and not at 15m. The 30 m window forgets the low ratio after the switch:
  # the share of hits in it passes 30% five minutes later, so it is resolved long before 30 m.
  - name: PromptCacheHitRatioLow fires after 15m below 30 percent, names model and mode, and resolves when the hit ratio recovers
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0+120000x80 10080000+480000x200'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+480000x80 38520000+120000x200'}
    alert_rule_test:
      - {eval_time: 15m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - eval_time: 15m15s
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m1, mode: sync}
            exp_annotations:
              summary: "m1 sync prompt cache hit ratio is 20% over 30m, below 30%, for 15m"
              description: &cache-text >-
                Under 30% of the prompt tokens measured in the last 30 minutes came from the engine's prefix cache, with at
                least 300000 prompt tokens behind that ratio. Capacity per card goes with 1 / (1 - hit ratio), so every point
                lost is customers the card no longer carries. The 0.30 line and the 300000-token floor are placeholders that
                the GPU day (Day A) tunes. It stays quiet while the series does not exist, while the traffic is under the floor,
                and while the engine contract says prefix caching is off (carmona_engine_contract_ok{check="prefix_caching"}
                reads 0: EngineContractMismatch names that case). What to do: confirm the engine flags first, prefix caching (the gauge above) and
                --enable-prompt-tokens-details (without it the engine reports no cached_tokens and every request reads as a miss).
                Then look at engine restarts (a restart empties the cache, and the first request of each prefix after it is cold) and at memory
                pressure (engine:cache_usage near 1, vllm:num_preemptions_total rising: old blocks are evicted to make room).
                Then the customer's prompt layout against docs/inference/prompt-caching.md: anything that changes per request
                above the shared part (a timestamp, an id, a name) breaks the cache from that point on.
                carmona_inference_first_output_seconds by cache (none, partial, full) tells which: mostly none means the cache
                is not hit at all, partial means a prefix is hit and something early in the prompt changes. The metric has no
                organization on purpose; per-organization numbers are the cachedInputTokens and inputTokens of the usage events.
      - eval_time: 20m
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m1, mode: sync}
            exp_annotations:
              summary: "m1 sync prompt cache hit ratio is 20% over 30m, below 30%, for 15m"
              description: *cache-text
      # 3m15s (13 scrapes) after the switch the 15 m ratio is back over the line (33%) and the 30 m ratio, which the alert reads, is not.
      - eval_time: 23m15s
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m1, mode: sync}
            exp_annotations:
              summary: "m1 sync prompt cache hit ratio is 28.39% over 30m, below 30%, for 15m"
              description: *cache-text
      - {eval_time: 30m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 45m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # A healthy cache (80% hits) on the same traffic never alerts.
  - name: PromptCacheHitRatioLow stays quiet while the hit ratio is healthy
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0+48000x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+12000x300'}
    alert_rule_test:
      - {eval_time: 30m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 60m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # --- the traffic floor: a ratio of nothing, or of a handful of requests, is not a finding -------------------------------------------
  # The floor is 300000 prompt tokens measured in the 30 m window: ten requests of the 32000-token shape the card is sized for, or three
  # hundred of 1000 tokens. Every case below has a hit ratio of 0, which fires without the floor.

  # 2400 tokens per scrape is 288000 in 30 m: under the floor for as long as it lasts.
  - name: PromptCacheHitRatioLow stays quiet under the token floor even at a hit ratio of 0
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+2400x400'}
    alert_rule_test:
      - {eval_time: 45m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 90m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # One cold prefill (32000 tokens) after the window opens and nothing else: the first request of the day, warm-up included, is cold by
  # design. The counters then stay flat. The request is in the 30 m window until 32m15s, at a ratio of 0 and a tenth of the floor, so
  # without the floor the alert would fire from 17m to 32m.
  - name: PromptCacheHitRatioLow stays quiet on the one cold request of a new window
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0x8 32000x400'}
    alert_rule_test:
      - {eval_time: 25m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 45m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # 2600 tokens per scrape is 312000 in 30 m, just over the floor: it holds from about the 29th minute, so the alert is still pending at
  # 40 m and firing at 60 m.
  - name: PromptCacheHitRatioLow fires just over the token floor
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+2600x400'}
    alert_rule_test:
      - {eval_time: 40m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - eval_time: 60m
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m1, mode: sync}
            exp_annotations:
              summary: "m1 sync prompt cache hit ratio is 0% over 30m, below 30%, for 15m"
              description: *cache-text

  # The line is inclusive: 2500 tokens per scrape is exactly 300000 in a full window, and 2499 is 299880.
  - name: PromptCacheHitRatioLow counts exactly the floor and not a scrape's worth under it
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+2500x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="miss"}', values: '0+2499x400'}
    alert_rule_test:
      - eval_time: 60m
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m1, mode: sync}
            exp_annotations:
              summary: "m1 sync prompt cache hit ratio is 0% over 30m, below 30%, for 15m"
              description: *cache-text

  # --- the engine contract guard: with prefix caching off the ratio is 0 by construction, and that case has its own signal ----------------
  # carmona_engine_contract_ok{check="prefix_caching"} is 1 (on), 0 (off) and ABSENT when the engine does not say (the check cannot be
  # made, or the simulator, which has no such label). Only a 0 silences this alert, and only for that model.

  - name: PromptCacheHitRatioLow stays quiet while the engine contract says prefix caching is off
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+600000x400'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m1", replica="0", check="prefix_caching"}', values: '0x400'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m1", replica="0", check="models"}', values: '1x400'}
    alert_rule_test:
      - {eval_time: 20m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 60m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # Another failing check says nothing about the cache, and a cache the engine says is on has no excuse: both fire. (The cases above
  # and below have the gauge absent, which also fires.)
  - name: PromptCacheHitRatioLow still fires when prefix caching is on and when another contract check fails
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+600000x400'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m1", replica="0", check="prefix_caching"}', values: '1x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="miss"}', values: '0+600000x400'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m2", replica="0", check="capacity"}', values: '0x400'}
    alert_rule_test:
      - eval_time: 20m
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m1, mode: sync}
            exp_annotations:
              summary: "m1 sync prompt cache hit ratio is 0% over 30m, below 30%, for 15m"
              description: *cache-text
          - exp_labels: {severity: info, model: m2, mode: sync}
            exp_annotations:
              summary: "m2 sync prompt cache hit ratio is 0% over 30m, below 30%, for 15m"
              description: *cache-text

  # The guard is per model: m1 has caching off (both modes are silenced, whichever inference-service replica reports it), m2 has a 0
  # on one of its two engine replicas (the model's ratio is polluted by that one: silenced too), m3 is fine and is the one that fires.
  - name: PromptCacheHitRatioLow guard silences the model whose engine has caching off, in every mode, and no other model
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="batch", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m3", mode="sync", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m3", mode="batch", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+600000x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="batch", result="miss"}', values: '0+600000x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="miss"}', values: '0+600000x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m3", mode="sync", result="miss"}', values: '0+600000x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m3", mode="batch", result="miss"}', values: '0+600000x400'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m1", replica="0", check="prefix_caching"}', values: '0x400'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.3:8081", model="m1", replica="0", check="prefix_caching"}', values: '0x400'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m2", replica="0", check="prefix_caching"}', values: '1x400'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m2", replica="1", check="prefix_caching"}', values: '0x400'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m3", replica="0", check="prefix_caching"}', values: '1x400'}
    alert_rule_test:
      - eval_time: 30m
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m3, mode: sync}
            exp_annotations:
              summary: "m3 sync prompt cache hit ratio is 0% over 30m, below 30%, for 15m"
              description: *cache-text
          - exp_labels: {severity: info, model: m3, mode: batch}
            exp_annotations:
              summary: "m3 batch prompt cache hit ratio is 0% over 30m, below 30%, for 15m"
              description: *cache-text

  # An engine that was started without caching and is fixed: the check reads 0 for 45 minutes (no alert), then 1 as the hits come back.
  # The 30 m ratio is still under 0.30 for about 14 minutes after the fix (misses leave the window as hits enter it), shorter than the
  # 15m `for`, so the old window never turns into an alert. (Per minute: 160000 miss tokens before, 80000 hit tokens after.)
  - name: PromptCacheHitRatioLow does not fire on the tail of the old window once the engine is fixed
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0x180 20000+20000x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+40000x180 7200000x300'}
      - {series: 'carmona_engine_contract_ok{job="inference", instance="10.0.0.2:8081", model="m1", replica="0", check="prefix_caching"}', values: '0x180 1x300'}
    alert_rule_test:
      - {eval_time: 44m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 52m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 59m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 61m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 90m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # A cache that never hits: only the miss series exists, because a counter is created by its first increment and nothing was ever added
  # to the hit one (or the engine reports no cached_tokens at all). `hit / total` over a vector with no hit series is an empty vector,
  # which would make the alert silent exactly when the cache is dead. The ratio is 0, so the alert fires.
  - name: PromptCacheHitRatioLow fires and the ratio reads 0 when the hit series does not exist
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+600000x400'}
    promql_expr_test:
      - expr: prompt_cache:hit_ratio_15m
        eval_time: 31m
        exp_samples:
          - {labels: 'prompt_cache:hit_ratio_15m{model="m1", mode="sync"}', value: 0}
      - expr: prompt_cache:hit_ratio_30m
        eval_time: 31m
        exp_samples:
          - {labels: 'prompt_cache:hit_ratio_30m{model="m1", mode="sync"}', value: 0}
    alert_rule_test:
      - {eval_time: 15m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - eval_time: 15m15s
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m1, mode: sync}
            exp_annotations:
              summary: "m1 sync prompt cache hit ratio is 0% over 30m, below 30%, for 15m"
              description: *cache-text

  # --- edges: the line, the `for`, restarts, silence, and who is named ------------------------------------------------------------------

  # The line is 0.30 and strict. Three models on 9000 tokens per scrape (1.08 million in 30 m): 29% hits fires, exactly 30% does not (the
  # alert says "under"), 31% does not. 2700 of 9000 comes out as exactly 0.3 at every evaluation, which 180000 of 600000 does not (a
  # float, divided twice), so a `<=` in the rule fails here.
  - name: PromptCacheHitRatioLow fires at 29 percent and stays quiet at exactly 30 and at 31
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0+2610x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+6390x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="hit"}', values: '0+2700x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="miss"}', values: '0+6300x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m3", mode="sync", result="hit"}', values: '0+2790x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m3", mode="sync", result="miss"}', values: '0+6210x300'}
    alert_rule_test:
      - eval_time: 40m
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m1, mode: sync}
            exp_annotations:
              summary: "m1 sync prompt cache hit ratio is 29% over 30m, below 30%, for 15m"
              description: *cache-text

  # Low for 14m45s, back up at the next scrape: pending, never firing. (A hit counter that jumps is a burst of cached work; the ratio is
  # over 0.30 from that scrape on, and stays there.)
  - name: PromptCacheHitRatioLow does not fire when the ratio is back over the line one scrape before the 15m
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0+120000x60 107200000+480000x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+480000x400'}
    alert_rule_test:
      - {eval_time: 15m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 15m15s, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 30m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # A daily window opens on an empty cache. Eight cold requests of 32000 tokens at once (256000 miss tokens, under the floor), then the
  # customer's traffic hits a little at a time (8000 hit tokens a minute): the 30 m ratio is under 0.30 from the minute the floor holds
  # until the hits are 30% of the window, about eight minutes in all, and that is under the 15m: a cold start never alerts.
  - name: PromptCacheHitRatioLow does not fire on a cold start that warms up
    interval: 1m
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0x2 256000x100'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0x2 0+8000x100'}
    alert_rule_test:
      - {eval_time: 10m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 20m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 40m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # inference-service restarts: its counters start again from 0. rate() reads a drop as a reset, so the ratio stays 0.7 (the replicas
  # split 600000 tokens a scrape each, one at 90% hits and one at 50%; rounded to 0.01 here: the sum of two replicas' rates is not exact
  # to the last digit) and nothing fires. delta() would read the drop as negative tokens, and with replicas at different ratios the
  # negative part moves the sum.
  - name: PromptCacheHitRatioLow reads through a counter reset when inference-service restarts
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0+540000x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+60000x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.3:8081", model="m1", mode="sync", result="hit"}', values: '0+300000x140 0+300000x260'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.3:8081", model="m1", mode="sync", result="miss"}', values: '0+300000x140 0+300000x260'}
    promql_expr_test:
      - expr: round(prompt_cache:hit_ratio_30m, 0.01)
        eval_time: 40m
        exp_samples:
          - {labels: '{model="m1", mode="sync"}', value: 0.7}
      - expr: round(prompt_cache:hit_ratio_15m, 0.01)
        eval_time: 40m
        exp_samples:
          - {labels: '{model="m1", mode="sync"}', value: 0.7}
    alert_rule_test:
      - {eval_time: 30m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 60m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # Models and modes are told apart: m1 sync is healthy (80%), m1 batch (10%) and m2 sync (10%) are not, m2 batch has no traffic. The
  # alert names exactly the two that are low, each with its own model and mode.
  - name: PromptCacheHitRatioLow names the model and the mode that are low and no other
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0+480000x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+120000x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="batch", result="hit"}', values: '0+60000x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="batch", result="miss"}', values: '0+540000x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="hit"}', values: '0+60000x300'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m2", mode="sync", result="miss"}', values: '0+540000x300'}
    alert_rule_test:
      - eval_time: 30m
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m1, mode: batch}
            exp_annotations:
              summary: "m1 batch prompt cache hit ratio is 10% over 30m, below 30%, for 15m"
              description: *cache-text
          - exp_labels: {severity: info, model: m2, mode: sync}
            exp_annotations:
              summary: "m2 sync prompt cache hit ratio is 10% over 30m, below 30%, for 15m"
              description: *cache-text

  # --- silence: nothing to measure is nothing to say ----------------------------------------------------------------------------------

  # The counter is created by the first measured request: until then there is no series (a deployment before the counter, an engine that
  # never reports cached_tokens through a final usage chunk, a model nobody called), and the records have nothing to say either.
  - name: PromptCacheHitRatioLow is silent and the records are empty while the counter does not exist
    interval: 15s
    input_series:
      - {series: 'up{job="inference", instance="10.0.0.2:8081"}', values: '1x400'}
      - {series: 'carmona_inference_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", kind="input"}', values: '0+60000x400'}
    promql_expr_test:
      - {expr: prompt_cache:hit_ratio_15m, eval_time: 40m, exp_samples: []}
      - {expr: prompt_cache:hit_ratio_30m, eval_time: 40m, exp_samples: []}
      - {expr: prompt_cache:tokens_rate_15m, eval_time: 40m, exp_samples: []}
      - {expr: prompt_cache:tokens_30m, eval_time: 40m, exp_samples: []}
    alert_rule_test:
      - {eval_time: 40m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 90m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # Traffic that stopped: the counters exist and no longer move. Nothing is in the 30 m window, so the volume is 0 and the ratio is 0 / 0
  # (NaN, which is under no line).
  - name: PromptCacheHitRatioLow is silent when the counters stopped moving
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '500000x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '9000000x400'}
    promql_expr_test:
      - expr: prompt_cache:tokens_30m
        eval_time: 40m
        exp_samples:
          - {labels: 'prompt_cache:tokens_30m{model="m1", mode="sync"}', value: 0}
    alert_rule_test:
      - {eval_time: 40m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 90m, alertname: PromptCacheHitRatioLow, exp_alerts: []}

  # The floor counts the tokens through a restart of inference-service: 312000 miss tokens in every 30 m, and the counter starts again from
  # 0 at 50m15s. increase() adds what was counted before the reset to what came after; a plain difference of the first and last value
  # would read the drop as negative tokens and put the volume under the floor.
  - name: PromptCacheHitRatioLow counts the floor through a counter reset
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0x500'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+2600x200 0+2600x300'}
    alert_rule_test:
      - eval_time: 70m
        alertname: PromptCacheHitRatioLow
        exp_alerts:
          - exp_labels: {severity: info, model: m1, mode: sync}
            exp_annotations:
              summary: "m1 sync prompt cache hit ratio is 0% over 30m, below 30%, for 15m"
              description: *cache-text

  # The floor belongs to the model and the mode: m1 sync carries plenty of traffic at a healthy ratio, m1 batch is two cold requests of
  # 32000 tokens (a ratio of 0 on 64000 tokens, far under the floor). A floor read per model would let the batch lane's two requests
  # through on the strength of the sync lane's volume.
  - name: PromptCacheHitRatioLow applies the token floor to each mode on its own
    interval: 15s
    input_series:
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="hit"}', values: '0+480000x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="sync", result="miss"}', values: '0+120000x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="batch", result="hit"}', values: '0x400'}
      - {series: 'carmona_inference_prompt_cache_tokens_total{job="inference", instance="10.0.0.2:8081", model="m1", mode="batch", result="miss"}', values: '0x20 32000x10 64000x400'}
    alert_rule_test:
      - {eval_time: 30m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
      - {eval_time: 45m, alertname: PromptCacheHitRatioLow, exp_alerts: []}
