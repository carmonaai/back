# Recording and alert rules. Prometheus evaluates them and Grafana lists them and their state (the
# Prometheus datasource is provisioned with alert management on). There is deliberately no Alertmanager:
# no destination has been chosen, so firing state is what an operator reads. What to do about each alert is
# in .claude/skills/carmona-architecture/references/observability.md.
groups:
  # The SLOs, using the targets the code and the benches already hold (inference-plan.md §8; phase-3 and
  # phase-5 measurements): TTFT p95 below 2 s and inter-token p95 below 100 ms are the goodput definition,
  # and TTFT is where capacity C = 4 shows up first.
  - name: inference-slo
    rules:
      - record: ttft:p95_5m
        expr: histogram_quantile(0.95, sum by (le, model, tier) (rate(carmona_inference_ttft_seconds_bucket[5m])))

      # Goodput: the share of requests whose first token arrived within 2 s (2 is a bucket boundary in the
      # metric contract, which is why it can be read straight off the histogram).
      - record: ttft:goodput_5m
        expr: |
          sum by (model, tier) (rate(carmona_inference_ttft_seconds_bucket{le="2"}[5m]))
            / sum by (model, tier) (rate(carmona_inference_ttft_seconds_count[5m]))

      - record: itl:p95_5m
        expr: histogram_quantile(0.95, sum by (le, model, tier) (rate(carmona_inference_itl_seconds_bucket[5m])))

  # The engine from its own /metrics, which is also what the queue-depth alert needs: inference-service's
  # carmona_engine_* gauges come from a reconcile that runs hourly, too coarse to alert on.
  - name: engine
    rules:
      - record: engine:requests_running
        expr: max by (job) (vllm:num_requests_running)

      - record: engine:requests_waiting
        expr: max by (job) (vllm:num_requests_waiting)

      # What EngineQueueSustained compares: the waiting requests of ALL replicas of the engine against the queue places
      # inference-service admits (carmona_engine_queue_places), which is the model's total over its replicas and is
      # reported identically by every inference-service replica, hence max by (model) before the sum over models. The
      # per-replica maximum above would be compared with a fleet number and never reach it.
      - record: engine:requests_waiting_total
        expr: sum by (job) (vllm:num_requests_waiting)

      - record: engine:queue_places
        expr: sum(max by (model) (carmona_engine_queue_places))

      # vLLM v0.30.0 reports kv_cache_usage_perc ("1 means 100 percent usage" in its own help text) -- not the
      # gpu_cache_usage_perc the task A brief names, which that image does not expose. The simulator reports
      # the same series, at 0 unless it runs with --enable-kvcache.
      - record: engine:cache_usage
        expr: max by (job) (vllm:kv_cache_usage_perc)

      # The queue places inference-service admits behind the slots (carmona_engine_queue_places, WP-03) are what a full queue
      # means: admission lets at most slots + places in flight, so waiting at the places is admission with the engine at its
      # full stretch, and TTFT has already run away. The first version compared with the constant 8, the simulator's own
      # --max-waiting-queue-length; on a real vLLM, whose --max-num-queued-reqs counts running + waiting, at most the places
      # (2 with 4 slots) can wait, so `>= 8` never fired (engine-contract finding A). Fleet against fleet: the sum of the
      # replicas' waiting (engine:requests_waiting_total) against the sum of their places (engine:queue_places), so a single
      # replica with room keeps it quiet, as admission sends the next request there. While the places gauge is not reported
      # (inference-service down, or a build before WP-03) there is no threshold and the alert stays quiet, not guessing;
      # ServiceDown is what names a dead inference-service. The trailing `> 0`: a model may have no queue places (queue: 0 is valid),
      # and an idle engine would then read 0 >= 0 for ever. Tested in rules.test.yml.
      # In the engine group, after the two records it reads: rules of one group run in order, so the alert sees the value of
      # the same evaluation (across groups it would see the last one, and promtool does not fix the order of groups).
      - alert: EngineQueueSustained
        expr: (engine:requests_waiting_total{job=~"engine|vllm"} >= on() group_left() engine:queue_places) > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} has {{ $value }} requests waiting, every queue place inference-service admits, for 2m"
          description: >-
            The engine holds as many waiting requests as inference-service lets queue behind the slots (the
            queue places, summed over the engine replicas): admission is running the engine at its full
            stretch, and the next request waits in TTFT or is refused. Check TTFT p95 and the refusals on the
            SLO dashboard; if the engine is healthy, C (slots) is the number to revisit. The engine's own cap
            (vLLM --max-num-queued-reqs counts running + waiting) must be slots + queue places, or it refuses
            before this fires.

  - name: availability
    rules:
      # Any of the eight services. Metrics stop, so this is the alert that turns every other one into a
      # silent failure if it is missing.
      - alert: ServiceDown
        expr: up{job=~"account|organization|auth|usage|billing|inference|batch|gateway"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} has not answered a scrape for 2m"
          description: >-
            Prometheus cannot reach {{ $labels.instance }}/actuator/prometheus ({{ $labels.job }}; one series per
            replica for inference and gateway, so this names the replica). The container may be down,
            still starting, or its management port not listening. Check the container's own health status
            and its logs. No metrics for this service means no SLI either.

      # inference and gateway are scraped through DNS service discovery (one target per replica), and a name that no longer
      # resolves (every replica removed) yields no target and no `up` series, so ServiceDown's `== 0` is an empty vector
      # exactly when the whole service is gone. Both services have at least one replica on every stack. Tested in rules.test.yml.
      - alert: ReplicatedServiceAbsent
        expr: absent(up{job="inference"}) or absent(up{job="gateway"})
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} has no scrape target at all for 2m"
          description: >-
            No replica of {{ $labels.job }} resolves any more (removed, or never started), so Prometheus has no target
            and no `up` series to alert on. Check `docker compose ps {{ $labels.job }}`.

      # One replica of a replicated job gone. What Prometheus sees depends on how the container went (progress document, H1a
      # review fixes): a replica whose name still resolves but does not answer reads `up == 0` (ServiceDown names it), while
      # one that Docker's DNS stops returning is simply dropped from discovery on the next refresh and leaves NO series, so
      # `up == 0` is silent. The second shape is what this catches: fewer targets than the job had in the last 30 m.
      # `vllm` is the GPU stack's engine job (`engine` is the simulator's): with two cards, losing one leaves the other answering,
      # EngineUnreachable stays quiet and Docker's DNS may drop the name without any `up == 0`, so this is the only alert that sees it.
      # ponytail: the baseline is "the most targets in 30 m", so it clears itself after 30 m and treats an intended scale-down
      # as an incident for that long; H4 replaces it with a gauge of the replicas the stack was asked for.
      - alert: ReplicaMissing
        expr: |
          count by (job) (up{job=~"inference|gateway|engine|vllm"})
            < max_over_time(count by (job) (up{job=~"inference|gateway|engine|vllm"})[30m:15s])
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} has fewer scrape targets than it had in the last 30m"
          description: >-
            A replica of {{ $labels.job }} no longer resolves or no longer exists, and the rest still answer, so no `up == 0`
            exists to alert on. Compare `docker compose ps {{ $labels.job }}` with the replicas you asked for.

      # Every replica of the engine at once is the outage (max by job: one replica of a fleet down is not). Two
      # shapes of it: targets that fail their scrape (up == 0), and no target at all, because DNS service discovery
      # drops a name that stops resolving (a removed container; a stopped one too, once Docker's DNS stops returning it) and Prometheus then writes no `up`
      # series, so `== 0` alone would stay silent exactly when the engine is gone. The second branch fires when
      # neither job has a series (the simulator stack has `engine`, the GPU one `vllm`; the other one is
      # legitimately empty, which is why both must be absent). Tested in rules.test.yml.
      - alert: EngineUnreachable
        expr: |
          max by (job) (up{job=~"engine|vllm"}) == 0
            or
          (absent(up{job="engine"}) and on() absent(up{job="vllm"}))
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "no model engine is reachable ({{ $labels.job }} target down)"
          description: >-
            Every engine scrape is failing: inference-service will answer 503 once its one retry is spent.
            Check the engine container (the real one downloads the model on first start, which is slow but
            the container reports starting, not failing) and confirm the key in .env still matches the one
            the engine was started with.

  # The money: usage that never reaches usage-service is revenue nobody bills, and the engine/stored-usage
  # comparison is the only thing that sees it (plan §8).
  - name: revenue-integrity
    rules:
      # carmona_inference_reconcile_mismatch is 1 when the existing hourly reconcile finds the engine's
      # token counters and usage-service's stored tokens outside its tolerance -- the WARN log today. Any
      # occurrence is worth an alert, so there is no for:.
      - alert: ReconciliationMismatch
        expr: max by (model) (carmona_inference_reconcile_mismatch) > 0
        labels: {severity: critical}
        annotations:
          summary: "engine counters and stored usage disagree for {{ $labels.model }}"
          description: >-
            Tokens the engine processed are not in usage-service: they will never be billed. Call
            GET /actuator/reconcile on inference-service (management port, internal network) for the delta,
            and check usage-service's ingestion errors and the usage:events stream in Valkey.

      # The revenue-leak signature: inference-service is answering requests and usage-service is receiving
      # nothing. Both series are real HTTP metrics, so this one works with today's stack.
      - alert: UsageIngestionStalled
        expr: |
          sum(rate(http_server_requests_seconds_count{job="inference", uri="/v1/chat/completions"}[5m])) > 0
            and
          sum(rate(http_server_requests_seconds_count{job="usage", uri="/usage/events"}[5m])) == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "requests are being served and no usage event is reaching usage-service"
          description: >-
            inference-service is answering /v1/chat/completions while usage-service has received nothing for
            5 m: every one of those requests is unbilled. Check the usage container, then the usage:events
            stream in Valkey (inference-service retries from there, so events are not lost yet -- a full
            stream or a dead relay is what to look for).

  # SLO breaches on the inference path. Both share the 5% line: the phase-4/phase-5 exit check is enterprise
  # goodput >= 95%, and phase-3's bench counts an error or a refusal as a miss.
  - name: inference-slo-alerts
    rules:
      - alert: ErrorShareHigh
        expr: |
          sum(rate(carmona_inference_requests_total{outcome="error"}[5m]))
            / sum(rate(carmona_inference_requests_total[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "more than 5% of inference requests have failed for 5m"
          description: >-
            outcome="error" over the last 5 m is above the goodput line. The code tag tells the story:
            502/503 are the engine or the pool, 500 is a defect in inference-service. Check the engine's
            own panels (running, waiting, cache) and the service's logs.

      - alert: PayingTierRefusals
        expr: |
          sum by (tier) (rate(carmona_inference_requests_total{tier=~"standard|enterprise", code=~"model_busy|rate_limit_exceeded"}[5m]))
            / sum by (tier) (rate(carmona_inference_requests_total{tier=~"standard|enterprise"}[5m])) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.tier }} is being refused more than 5% of the time for 5m"
          description: >-
            A paying tier is hitting model_busy or rate_limit_exceeded beyond the 95% goodput the phase-4
            exit check demands. Trial is shed first by design, so refusals there are not this alert: here it
            is capacity (C), a tier's share, or one organization holding the slots (VTC, gap 4).

      # carmona_inference_queue_wait_seconds is the time from a request being understood to its engine call starting (WP-01
      # moved the clock to the start; before that it read about zero whatever the customer waited). A paying tier waits at
      # most admission-wait (1.5 s) for a slot before the 429, so a p95 over 1 s means one in twenty admitted requests is at that
      # edge or past it: capacity, or a slow Valkey. Only requests that reached the engine are in it, so refusals do not move it. By
      # model and tier, like the TTFT rules; a tier with no traffic has a rate of 0, a quantile of NaN, and NaN is not > 1.
      # 10m, because a queue that drains within minutes is a burst, which the SLO panels show and nobody needs paged for.
      - alert: QueueWaitHigh
        expr: |
          histogram_quantile(0.95, sum by (le, model, tier) (rate(carmona_inference_queue_wait_seconds_bucket[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.model }} {{ $labels.tier }} requests wait {{ $value | humanizeDuration }} (p95) before the engine call starts, above 1s for 10m"
          description: >-
            Requests are admitted and then wait over a second between being understood and the engine call
            starting: a paying tier's wait for a free slot (at most admission-wait, 1.5 s, before it is refused),
            the rate-bucket and lease scripts, or a slow Valkey. If the engine is busy (running at its slots,
            waiting at its queue places) capacity is the cause: look at EngineQueueSustained and the tier's
            refusals. If the engine is idle, look at Valkey (LeaseStoreDown, its latency) and at inference-service's
            CPU. Refused requests are not in this number; PayingTierRefusals counts them.

  # Pipelines that fail without anything going down (OPEN-15). Each reads a gauge the service already exports, so none of
  # these needs new Java; each threshold is derived from the services' own timings and is wrong if those are re-tuned.
  - name: pipeline-health
    rules:
      # carmona_inference_lease_store_unavailable is 1 while a replica's call to Valkey fails (Leases.unavailable); the
      # replica keeps answering, admitting against its own share of the slots, so nothing else notices. Valkey is
      # restarted by Docker in seconds, so a minute is an outage and not a restart. One series per replica. A warning, not a
      # page: ADR 0001 calls this state degraded (every request is still served, only the caps are approximate).
      - alert: LeaseStoreDown
        expr: carmona_inference_lease_store_unavailable == 1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} cannot reach Valkey (the lease store) for 1m"
          description: >-
            Requests are still served: this replica admits against its own share of the slots and queue places
            (the model's, the tier's and the organization's, each divided by the expected-replicas setting, not by the
            number of replicas that run) and does not check the lease token budget, so the caps are only approximate
            until Valkey answers again. Check the valkey container and its health, then this replica's log for
            "lease store unavailable".

      # carmona_usage_seal_lag_seconds (UsageGauges) is how long the oldest window that is due has waited to be sealed. A
      # healthy usage-service reads 0, or between grace and grace + seal-every while the next run is pending: 60 s to 120 s,
      # plus up to 10 s of gauge-every, so 130 s at most. 180 s is that with a minute of margin, 5m is several missed seal
      # runs. A warning: nothing is lost, billing waits for the seal; DebitLagHigh is the page when the wait costs money.
      # The gauge is ABSENT while usage-service cannot read its database, so this stays quiet then (ServiceDown names a
      # dead service; a live one with a dead database logs it).
      # ponytail: the 180 is carmona.usage.grace + seal-every + gauge-every (60 + 60 + 10 s) plus margin, typed here and not
      # derived, so it is wrong if those are re-tuned; upgrade path: export them as a gauge and compare against it.
      - alert: SealLagHigh
        expr: carmona_usage_seal_lag_seconds > 180
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "usage windows are sealed {{ $value | humanizeDuration }} late (above 3m for 5m)"
          description: >-
            usage-service has not sealed the windows that are due: billing only bills sealed windows, so usage is
            piling up unbilled and the credit check runs on old balances. A healthy seal reads 0 to about 130 s
            (grace 60 s, seal-every 60 s, gauge-every 10 s). Check the usage container's log for seal errors, the
            database it seals in, and whether the seal job is held up behind another scheduled job.

      # carmona_billing_debit_lag_seconds (BillingGauges) is how long the oldest sealed window has waited to be billed. A
      # healthy billing-service reads 0, or up to grace + seal-every + debit-every (180 s, 190 s with gauge-every): the bound
      # the customer terms quote is that plus the 5 m window, 8 minutes (Overshoot), and this alert is that bound made
      # observable. 300 s is more than one missed debit run on top of the healthy ceiling. Critical, because a late debit
      # is credit enforced late, which is money served for free. Absent while billing cannot read its cursor, the clock or
      # usage-service, so quiet then (ServiceDown covers a dead billing-service).
      # ponytail: the 300 assumes the service defaults (the compose prototype runs a 16 s bound, far under it, so it is only
      # looser there); typed here and not derived, upgrade path: export the three settings as a gauge and compare against it.
      - alert: DebitLagHigh
        expr: carmona_billing_debit_lag_seconds > 300
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "billing is {{ $value | humanizeDuration }} behind on debiting sealed usage (above 5m for 5m)"
          description: >-
            billing-service has not debited windows that usage-service already sealed, so credit balances and the
            no_credit flags run late: a customer whose credit ran out keeps being served for longer than the 8
            minute overshoot bound the terms quote. A healthy debit reads 0 to about 190 s. Check the billing
            container's log for debit errors, whether usage-service answers it (the debit reads the sealed
            windows from there), and the database; a backlog drains 100 windows per run.

      # The two lag gauges above are ABSENT, never 0, while their service cannot compute them: usage-service when its database
      # does not answer, billing-service when it cannot read its cursor or the clock or usage-service does not answer. That is
      # exactly a stuck pipeline, and SealLagHigh and DebitLagHigh read nothing then. So: a service whose scrape answers
      # (`up == 1`) and whose gauge is not there. Down services are ServiceDown's (no `up == 1`); the first gauge-every after
      # a start has no gauge either, which 5m covers. Warning: it says the lag cannot be seen, not that it is high.
      - alert: LagGaugeMissing
        expr: |
          (up{job="usage"} == 1 unless on (job, instance) carmona_usage_seal_lag_seconds)
            or
          (up{job="billing"} == 1 unless on (job, instance) carmona_billing_debit_lag_seconds)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} answers its scrape but reports no lag gauge for 5m"
          description: >-
            The service is up and cannot compute its lag (the database does not answer, or for billing usage-service
            does not): the gauge is absent, not 0, so SealLagHigh and DebitLagHigh read nothing and a stuck
            pipeline would pass unnoticed. Check the service's log and the database it reads; a service that does
            not answer its scrape at all is ServiceDown.

  # The replica gates and the engine contract (DeepInfer packages WP-03, WP-08 and WP-09B). Every inference-service replica exports
  # these metrics, and the drain numbers are the same fleet-wide values on each of them (the leases are in Valkey), so every
  # expression aggregates the reporters away with max or min and never with sum: two reporters of overdue == 1 sum to 2, and a
  # `== 1` on that is silent exactly when two JVMs run. The gauges of a feature that is off do not exist (the health gate is off by
  # default; the contract gauge is absent until the check has run), so these alerts are silent then and say nothing about it.
  - name: engine-replicas
    rules:
      # carmona_replica_health_state is 1 while this inference-service replica has the engine replica out of rotation (WP-08: nobody
      # answered three scrapes, or three connections were refused; a timeout or a 5xx never counts, R-12). The state is each JVM's own
      # opinion, so max by: one JVM that cannot reach the engine is enough. A warning: with one replica the engine is gone for
      # everybody and EngineUnreachable (critical) fires as well; with more, the rest carry the traffic.
      - alert: ReplicaUnhealthy
        expr: max by (model, replica) (carmona_replica_health_state) == 1
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "replica {{ $labels.replica }} of {{ $labels.model }} is out of rotation (unhealthy) for 1m"
          description: >-
            inference-service's health gate stopped sending requests to this engine replica because nobody answered it:
            three scrapes of its /metrics in a row, or three refused connections while no scrape answered. This takes the
            most pessimistic opinion of the inference-service replicas. If it is the model's only replica, every request is
            a 503 engine_unavailable right now (EngineUnreachable fires too); with more, the others take its share. Check the
            engine container: an engine that is loading its model is unreachable for minutes and returns by itself after two
            answered scrapes, nothing needs resetting. Then the engine's own log.

      # The gauge above is read every 15 s; the gate goes out after 15 s of silence and back after two answered scrapes, so an outage
      # can begin and end between two scrapes. The counter keeps it. No `for`: by the time a `for` elapsed the event would be over.
      # HealthMetrics creates both directions at 0, so the first outage of a JVM's life is an increase. Sum over the reporters is right
      # here (each JVM counts its own transitions) and the alert names the model, not the replica (the counter has no replica tag).
      - alert: ReplicaWentUnhealthy
        expr: sum by (model) (increase(carmona_replica_health_transitions_total{to="unhealthy"}[10m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "a replica of {{ $labels.model }} was taken out of rotation in the last 10m"
          description: >-
            inference-service marked an engine replica unhealthy at least once in the last 10 minutes. ReplicaUnhealthy
            samples the state every 15 s, so an outage that began and ended between two scrapes (an engine restart, a
            network blip) shows only here. Once is an incident, a repeat is a flapping engine or a flaky link: look at the
            engine container's restarts and uptime (docker compose ps) and at the network between inference and the engine.

      # carmona_replica_drain_overdue is 1 while a DRAINING replica is past its grace with live leases (WP-09B); NaN, never 0, while
      # Valkey cannot say, and NaN is not 1. The leases are fleet-wide, so every inference-service replica exports the same value:
      # max by, never sum. A warning, 2m: Carmona waits and never cuts, the operator decides, so nothing is failing.
      - alert: ReplicaDrainOverdue
        expr: max by (model, replica) (carmona_replica_drain_overdue) == 1
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "replica {{ $labels.replica }} of {{ $labels.model }} is past its drain grace with requests still running for 2m"
          description: >-
            An operator drained this engine replica (POST /actuator/drain) and its grace has passed, but requests are still
            running on it. Carmona never cuts them: it takes no new request and waits. GET /actuator/drain on the inference
            management port shows inFlight and drained for the replica. Either wait for the streams, or destroy the card and
            accept that the rest end with an error event and are billed what they had produced. The engine is working; this
            is not a failure of it.

      # carmona_engine_contract_ok (WP-03) is 1 or 0 per check, and ABSENT while the check cannot be made (engine not up yet), so a 0
      # is a real mismatch and the alert needs no guard against start-up. It is rechecked every 10m by default, so `for: 5m` only
      # skips a reading that the next one would correct. min by: any inference-service replica reading 0 counts. A warning: the
      # check refuses nothing (fail-fast is off by default); it finds a deployment error before the first customer does.
      - alert: EngineContractMismatch
        expr: min by (model, replica, check) (carmona_engine_contract_ok) == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "engine replica {{ $labels.replica }} of {{ $labels.model }} fails the contract check {{ $labels.check }} for 5m"
          description: >-
            What Carmona assumes about the engine and what the engine reports disagree; nothing is refused because of it,
            the service keeps running. The check label says which: models (the served model id is not in /v1/models),
            models_len (the engine's max_model_len is below the context-window), metrics (a required metric family is
            missing), kv_tokens (no KV-cache size reported), capacity (a full-context request takes more than the capacity
            ratio of the KV cache), prefix_caching (prefix caching is off, and the shared-prefix workload depends on it).
            inference-service logs one WARN with the numbers when a check starts to fail, and looks again every
            recheck-every (10 m), so this clears by itself some minutes after the engine's flags are fixed.

  # The request guard (WP-07). Signals about client behaviour, not about the service: nothing here is a page.
  - name: request-guards
    rules:
      # Hard-class strings (the chat template's role markers) in client text. The default is to neutralize them, so the request is
      # served and this is information: a document that quotes a template, or an injection attempt. The soft class (think and tool
      # tags) is left out on purpose: a client that sends the model's own reasoning back on every turn would keep it firing for ever,
      # and an alert that always fires is one nobody reads. No organization is on the metric (and must not be); the window is an hour
      # because a few such strings a day is a quiet system.
      - alert: ControlTokensInContent
        expr: sum by (model) (increase(carmona_inference_control_tokens_total{class="hard"}[1h])) > 0
        labels: {severity: info}
        annotations:
          summary: "client text for {{ $labels.model }} held a hard control-token string in the last hour"
          description: >-
            A message or tool definition held a string that looks like the chat template's role markers (the hard class:
            an angle bracket and a pipe, a short name, a pipe and an angle bracket). By default the guard neutralizes it
            (a zero-width character goes after the first character, the visible text is unchanged, nothing is refused), so
            this is a signal and not a failure: a document that quotes a template, or an injection attempt. No organization
            is on the metric on purpose; ask the customer or look for the time in the access log. Whether a model should
            reject instead is decided after the GPU day check G-05, not by this alert.

      # Each refusal is a 400 the customer sees. A stray request is not a stuck client; ten in ten minutes is. `increase` extrapolates
      # to the window, so the line is only good to a request or two.
      # ponytail: 10 in 10m is typed, without a baseline (no customer yet); upgrade path: a share of the model's requests, once there
      # is traffic to take the share of.
      - alert: GuardRejections
        expr: sum by (model, code) (increase(carmona_inference_guard_rejected_total[10m])) >= 10
        labels: {severity: warning}
        annotations:
          summary: "the request guard answered 400 {{ $labels.code }} on {{ $labels.model }} at least ten times in 10m"
          description: >-
            A client keeps sending requests the guard refuses: invalid_role (a message role outside the accepted list, for
            example developer, which stays out until G-05), nesting_too_deep, or control_token_in_content (only for a model
            whose hard-mode or soft-mode is reject). The customer gets a 400 for each, so a new SDK or a changed template is
            the first thing to look for. The 400 text names the problem and never repeats the content; no organization is
            on any metric, so the client is found from the customer's side or from the access log by time.

  # The prompt cache (P0-1). carmona_inference_prompt_cache_tokens_total{model, mode, result} counts, once per request whose engine
  # usage was seen, the prompt tokens the engine served from its prefix cache (result="hit") and the rest (result="miss"). The hit
  # ratio is what sets how many customers one card carries (capacity goes with 1 / (1 - ratio)), and the one thing a customer can
  # break without knowing it (a timestamp near the top of a prompt invalidates every block after it).
  - name: prompt-cache
    rules:
      # Measured prompt tokens per second, hit and miss together: the traffic the ratio below is a share of.
      - record: prompt_cache:tokens_rate_15m
        expr: sum by (model, mode) (rate(carmona_inference_prompt_cache_tokens_total[15m]))

      - record: prompt_cache:hit_ratio_15m
        expr: |
          sum by (model, mode) (rate(carmona_inference_prompt_cache_tokens_total{result="hit"}[15m]))
            / sum by (model, mode) (rate(carmona_inference_prompt_cache_tokens_total[15m]))

      # The 30 minute reading, which is what the alert and the dashboard line compare with 0.30: a window long enough that one
      # long prompt does not move it, and the same number in both places.
      - record: prompt_cache:hit_ratio_30m
        expr: |
          sum by (model, mode) (rate(carmona_inference_prompt_cache_tokens_total{result="hit"}[30m]))
            / sum by (model, mode) (rate(carmona_inference_prompt_cache_tokens_total[30m]))

      # The prompt tokens measured in the 30 m window, hit and miss together: the volume behind the 30 m ratio. increase() only counts
      # what was scraped, so in the first minutes of a series it is what has been seen so far, not a full window.
      - record: prompt_cache:tokens_30m
        expr: sum by (model, mode) (increase(carmona_inference_prompt_cache_tokens_total[30m]))

      # Info: a signal about capacity and about how a customer builds prompts, not an outage. for 15m, because the daily window starts
      # with an empty cache: the first requests of each prefix are cold by design and the runbook warms it, and once hits resume the
      # 30 m ratio crosses 0.30 within about nine minutes (0.30 x 30 m), so a cold start never holds the condition for 15.
      # The floor: 300000 prompt tokens in the window (ten requests of the 32000-token shape the card is sized for, or three hundred of
      # 1000) before a ratio means anything. A ratio of nothing is NaN and NaN is not under 0.30, but the ratio of one cold request
      # is a clean 0, and the first request of every window is cold.
      # The guard: carmona_engine_contract_ok{check="prefix_caching"} (WP-03) is 0 when the engine reports enable_prefix_caching=False.
      # Then the ratio is 0 by construction, the cause is a flag and EngineContractMismatch (check prefix_caching) is the alert for it.
      # Only a 0 silences, by model (min over the engine replicas and the inference-service replicas that report it: one replica
      # without caching pollutes the model's ratio). Absent is not a 0: the gauge is absent while the check cannot be made, and on the
      # simulator, which has no such label; there the ratio is the only signal there is.
      # ponytail: 0.30, the 300000 and the 15m are placeholders, tuned on Day A when the first measured hit ratio of this model exists.
      - alert: PromptCacheHitRatioLow
        expr: |
          (
            (prompt_cache:hit_ratio_30m < 0.30)
              and on (model, mode)
            (prompt_cache:tokens_30m >= 300000)
          )
            unless on (model)
          (min by (model) (carmona_engine_contract_ok{check="prefix_caching"}) == 0)
        for: 15m
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.model }} {{ $labels.mode }} prompt cache hit ratio is {{ $value | humanizePercentage }} over 30m, below 30%, for 15m"
          description: >-
            Under 30% of the prompt tokens measured in the last 30 minutes came from the engine's prefix cache, with at
            least 300000 prompt tokens behind that ratio. Capacity per card goes with 1 / (1 - hit ratio), so every point
            lost is customers the card no longer carries. The 0.30 line and the 300000-token floor are placeholders that
            the GPU day (Day A) tunes. It stays quiet while the series does not exist, while the traffic is under the floor,
            and while the engine contract says prefix caching is off (carmona_engine_contract_ok{check="prefix_caching"}
            reads 0: EngineContractMismatch names that case). What to do: confirm that flag first. Then look at engine
            restarts (a restart empties the cache, and the first request of each prefix after it is cold) and at memory
            pressure (engine:cache_usage near 1, vllm:num_preemptions_total rising: old blocks are evicted to make room).
            Then the customer's prompt layout against docs/inference/prompt-caching.md: anything that changes per request
            above the shared part (a timestamp, an id, a name) breaks the cache from that point on.
            carmona_inference_first_output_seconds by cache (none, partial, full) tells which: mostly none means the cache
            is not hit at all, partial means a prefix is hit and something early in the prompt changes. The metric has no
            organization on purpose; per-organization numbers are the cachedInputTokens and inputTokens of the usage events.
