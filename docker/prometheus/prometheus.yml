# Prometheus scrapes every service's management port (8081: never published, never routed) and the engine's
# own /metrics. 15 s: enough to watch an incident develop, and the plan's 1 s pipeline belongs to
# multi-replica autoscaling, which does not exist yet (inference-plan.md §7).
global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # One job per service, so `job` carries the service name: every dashboard and alert selects on it. Only
  # /actuator/prometheus is exposed there; liveness is already the container's own healthcheck.
  - job_name: account
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["account:8081"]}]

  - job_name: organization
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["organization:8081"]}]

  - job_name: auth
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["auth:8081"]}]

  - job_name: usage
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["usage:8081"]}]

  - job_name: billing
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["billing:8081"]}]

  # inference and gateway are the replicated services (INFERENCE_REPLICAS, GATEWAY_REPLICAS): DNS service discovery gives
  # one target, and so one `up` and one `instance`, per replica. A static `inference:8081` is one target whatever the replica
  # count, and each scrape lands on whichever replica Docker's DNS returns, so per-replica series would merge. The rest
  # have no replica knob and stay static: a container that is gone then still has a target, `up == 0`, and ServiceDown sees it.
  # What a replica that goes away looks like is not one thing (progress document, H1a review fixes): in the live run a
  # stopped replica left Docker's DNS at once and its target was dropped on the next refresh with no `up == 0` sample
  # (ReplicaMissing sees it); the reviewers saw the name keep resolving, time out and a stale target read up == 0
  # (ServiceDown sees it). The rules cover both; ReplicatedServiceAbsent covers every replica gone.
  - job_name: inference
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - {names: [inference], type: A, port: 8081, refresh_interval: 15s}

  - job_name: batch
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["batch:8081"]}]

  - job_name: gateway
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - {names: [gateway], type: A, port: 8081, refresh_interval: 15s}

  # The engine's own counters, the only queue-depth and KV-cache reading that refreshes faster than
  # inference-service's hourly reconcile. Job `engine` is the simulator (the default engine, series named as vLLM
  # names them); job `vllm` is the real one under compose.gpu.yaml. Each stack runs one of them: DNS service discovery
  # yields no target for a name that does not resolve, so the other job has no series and no alert, never a DOWN
  # target. It also yields one target per replica, so a fleet is scraped replica by replica (rules aggregate with
  # `max by (job)`). An engine that wants its key on /metrics gets it from the file compose writes at container
  # start (/etc/prometheus is read-only, so the key never reaches a repo file and has no default).
  - job_name: engine
    metrics_path: /metrics
    bearer_token_file: /tmp/engine-key
    dns_sd_configs:
      - {names: [engine], type: A, port: 8000, refresh_interval: 15s}

  - job_name: vllm
    metrics_path: /metrics
    bearer_token_file: /tmp/engine-key
    dns_sd_configs:
      - {names: [vllm], type: A, port: 8000, refresh_interval: 15s}

  # Prometheus itself: its own health and TSDB size, which is what the memory ceiling is spent on.
  - job_name: prometheus
    static_configs: [{targets: ["127.0.0.1:9090"]}]
