# The real engine on top of compose.yaml, for machines with an NVIDIA GPU (the laptop's RTX 3050 6 GB):
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build --wait
#   ENGINE=vllm bash smoke.sh      # runs the assertions the simulator cannot (engine idle after a hang-up)
# vLLM serves Qwen3-4B-Instruct-2507 (4-bit AWQ) as the only model, in place of the simulator (profiled out below).
# CI keeps the simulator: GitHub's runners have no GPU.
services:
  # The simulator is the default engine; with the real one it is not started, and nothing may wait for it.
  engine:
    profiles: ["simulator-off"]

  vllm:
    image: vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
    # Sized for 6 GB, of which Windows keeps ~1 GB for the desktop (vLLM refused 0.85: 5.03 GiB free):
    # 0.78 = ~4.7 GiB: 3.29 GiB weights, ~0.9 GiB CUDA/WSL overhead, 0.44 GiB KV cache. An FP8 KV cache
    # halves the bytes per token, so a full 4096-token request fits (bf16 needed 0.56 GiB).
    # 4 requests at once; priority scheduling
    # (inference-service sets the tier), usage with cached tokens, hermes tool calls. Request logging
    # stays at vLLM's default (off): prompts must never reach a log.
    # --max-num-queued-reqs counts running + waiting (vLLM v0.30.0 scheduler config, engine-contract section 4 row 12 and finding A),
    # so it is the slots plus the queue places inference-service admits: 4 + 2 = 6, the defaults of compose.yaml (ENGINE_SLOTS,
    # ENGINE_QUEUE). The earlier 8 let 8 requests in, 4 of them waiting, where admission only ever lets 2 wait. Day A step 8 checks it.
    # --shutdown-timeout: vLLM aborts what it holds on SIGTERM unless this is positive (mvp-vllm section 3.1, OPEN-13). 600 s matches the
    # runbook of mvp-vllm; stop_grace_period must exceed it or Docker sends SIGKILL first, and inference-service's own 720 s must too.
    command: ["cyankiwi/Qwen3-4B-Instruct-2507-AWQ-4bit",
              "--revision", "c46e2277ae3dee7d030f45c58987b291edc5c1d6",
              "--served-model-name", "carmona/qwen3-4b",
              "--host", "0.0.0.0", "--port", "8000",
              "--max-model-len", "4096", "--max-num-seqs", "4", "--max-num-queued-reqs", "6",
              "--shutdown-timeout", "600",
              "--kv-cache-dtype", "fp8",
              "--gpu-memory-utilization", "0.78",
              "--scheduling-policy", "priority",
              "--enable-prompt-tokens-details",
              "--enable-auto-tool-choice", "--tool-call-parser", "hermes"]
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?set in .env}
    volumes: [hf-cache:/root/.cache/huggingface]
    shm_size: 2gb
    stop_grace_period: 660s            # above --shutdown-timeout (600 s): a restart waits for the streams vLLM holds
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # No curl in the image: Python asks /health.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 900s            # first start downloads ~3 GB and captures CUDA graphs
    networks: [internal]

  inference:
    environment:
      # The same model as the simulator's, at vLLM (the whole list is stated: see compose.yaml). 4 slots and 2 queued
      # are C and q from the phase-3 bench, the defaults of compose.yaml.
      CARMONA_INFERENCE_MODELS_0_URL: http://vllm:8000
      CARMONA_INFERENCE_MODELS_0_APIKEY: ${VLLM_API_KEY:?set in .env}
      # compose.yaml narrows the contract check to the simulator's four metric families; the real engine is held to the code default (vLLM's
      # eight), which `!reset` brings back by removing the variable.
      CARMONA_INFERENCE_CONTRACT_REQUIREDFAMILIES: !reset null
    depends_on: !override
      valkey: { condition: service_healthy }
      usage: { condition: service_healthy }
      vllm: { condition: service_healthy }

volumes:
  hf-cache: {}
