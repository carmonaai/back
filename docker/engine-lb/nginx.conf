# STAND-IN for the replica picker, between inference-service and the simulated engines (fleet profile): one model url
# for inference-service, N simulator containers behind it, least_conn per request. It is NOT between the gateway and
# inference-service (the gateway balances those replicas itself) and it is not part of the product: a Kubernetes
# Service, or the `replicas` list of the model (inference-plan.md section 2), takes its place.
# Runs as a non-root user: pid and temp files live in /tmp (a tmpfs of the container), the port is above 1024.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's embedded DNS. `resolve` (open source since nginx 1.27.3) re-reads the name every few seconds, so a
    # simulator that was killed and recreated, or added by --scale, is found without restarting this container.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream engines {
        zone engines 64k;               # shared across workers: without it each worker counts alone and all pick the first peer
        least_conn;
        # Passive health: two failed attempts (connect error or timeout; an engine 429 is an answer, not a failure) take a
        # simulator out for 5 s. nginx's default (1 failure, 10 s) kept a killed simulator in rotation long enough to turn
        # a third of a burst into 503s (progress document, H1a); 2 / 5 s trades a little of that for not flapping on one blip.
        server engine:8000 resolve max_fails=2 fail_timeout=5s;
        keepalive 64;
    }
    server {
        listen 8000;
        location / {
            proxy_pass http://engines;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;        # SSE must flow chunk by chunk
            proxy_connect_timeout 2s;   # a dead simulator on the same network answers a connect at once or never: do not wait 60 s
            proxy_read_timeout 600s;
            proxy_next_upstream off;    # an engine 429 is an answer, never retried on another simulator
        }
    }
}
