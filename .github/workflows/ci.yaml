# Builds every module, runs unit + Testcontainers tests, then the stack and smoke.sh.
# A broken migration, a Resource/Feign mismatch or a security regression in the smoke test fails it.
#
# The documentation site is excluded: it has its own workflow (docs.yaml), and a prose-only change should
# not spend seven minutes of Testcontainers to prove that no Java changed.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - requirements.txt
  pull_request:
    paths-ignore:
      - docs/**
      - mkdocs.yml
      - requirements.txt

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest   # Docker preinstalled; Testcontainers needs a Linux runner
    timeout-minutes: 30
    steps:
      # back itself, with the default GITHUB_TOKEN.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The modules are private sibling repos GITHUB_TOKEN can't read. CARMONAI_TOKEN is a
      # fine-grained token, Contents: read-only on the module repos only (not back).
      - name: Fetch the modules
        env:
          TOKEN: ${{ secrets.CARMONAI_TOKEN }}
        run: |
          # Fail fast, naming the repo the token can't read (prints status codes only).
          for repo in $(git config -f .gitmodules --get-regexp '\.url$' | sed -E 's#.*github\.com/(.*)\.git$#\1#'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$repo")
            echo "$repo: $code"
            [ "$code" = 200 ] || { echo "::error::CARMONAI_TOKEN cannot read $repo (HTTP $code)"; exit 1; }
          done
          # Global config reaches the submodule clones (git -c settings may not); removed right after.
          git config --global url."https://x-access-token:${TOKEN}@github.com/carmonai/".insteadOf "https://github.com/carmonai/"
          git submodule update --init --recursive
          git config --global --remove-section url."https://x-access-token:${TOKEN}@github.com/carmonai/"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      # Fresh secrets every run; none are stored anywhere.
      - name: Generate docker/.env
        working-directory: docker
        run: |
          {
            echo "DB_NAME=carmonai"
            echo "DB_USER=carmonai"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "VALKEY_PASSWORD=$(openssl rand -hex 24)"
            echo "ENGINE_API_KEY=$(openssl rand -hex 24)"
            echo "JWT_PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | grep -v -- ----- | tr -d '\r\n')"
          # The observability stack's Grafana requires this (compose asserts on it), so the generated .env
          # must carry it too: without the line, compose aborts at variable interpolation before any
          # container starts.
          echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -base64 18)"
          } > .env

      - name: Start the stack
        id: stack
        working-directory: docker
        run: docker compose up -d --build --wait

      - name: Smoke test
        working-directory: docker
        run: bash smoke.sh

      # Only when the stack was started: an earlier failure leaves nothing to show or stop.
      - name: Service logs
        if: failure() && steps.stack.outcome != 'skipped'
        working-directory: docker
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always() && steps.stack.outcome != 'skipped'
        working-directory: docker
        run: docker compose down -v
